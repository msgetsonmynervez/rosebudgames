      function applyCanvasScaling() {
        var canvasEl = document.getElementById('gameCanvas');
        if (!canvasEl) return;

        var windowW = window.innerWidth;
        var windowH = window.innerHeight;

        // Compute scale to fill window maintaining 3:2 ratio
        var scaleX = windowW / VIEWPORT_W;
        var scaleY = windowH / VIEWPORT_H;
        var scale = Math.min(scaleX, scaleY);
        var dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));

        canvasDeviceScale = dpr;
        canvasEl.width = Math.floor(VIEWPORT_W * dpr);
        canvasEl.height = Math.floor(VIEWPORT_H * dpr);

        canvasEl.style.width = Math.floor(VIEWPORT_W * scale) + 'px';
        canvasEl.style.height = Math.floor(VIEWPORT_H * scale) + 'px';

        canvasEl.style.imageRendering = 'auto';
        if (ctx) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
        }
      }

      function gameLoop(timestamp) {
        // Support fast tick for testing
        var effectiveTickInterval = window.__FAST_TICK__ || (1000 / 60);

        if (simulationSuspended) {
          lastTimestamp = timestamp;
          render();
          clearFrameInput();
          mouseClicked = false;
          requestAnimationFrame(gameLoop);
          return;
        }

        if (lastTimestamp === 0) {
          lastTimestamp = timestamp;
        }

        var dt = (timestamp - lastTimestamp) / 1000;
        dt = Math.min(dt, 0.05); // Cap at 50ms to prevent spiral of death
        lastTimestamp = timestamp;

        // Tick instrumentation
        window.__GAME_STATE__.tick();

        // Layer 8: TITLE state handler
        if (gameState.state === 'TITLE') {
          gameState.titlePulseTimer += dt;

          // Update title particles
          updateTitleParticles(dt);
          updateParticles(dt);  // Existing particle update (for ambient particles)

          // Handle character selection click
          if (mouseClicked) {
            // Layer 9: Use available character IDs for selection
            var availableIds = getAvailableCharacterIds();
            var totalWidth = availableIds.length * CHARACTER_PORTRAIT_SIZE +
                             (availableIds.length - 1) * CHARACTER_PORTRAIT_GAP;
            var startX = (VIEWPORT_W - totalWidth) / 2;
            var portraitY = 200;

            for (var ci = 0; ci < availableIds.length; ci++) {
              var px = startX + ci * (CHARACTER_PORTRAIT_SIZE + CHARACTER_PORTRAIT_GAP);
              if (mouseX >= px && mouseX <= px + CHARACTER_PORTRAIT_SIZE &&
                  mouseY >= portraitY && mouseY <= portraitY + CHARACTER_PORTRAIT_SIZE) {
                gameState.selectedCharacter = availableIds[ci];
              }
            }

            // Check START button click
            if (gameState._startButtonRect) {
              var btn = gameState._startButtonRect;
              if (mouseX >= btn.x && mouseX <= btn.x + btn.w &&
                  mouseY >= btn.y && mouseY <= btn.y + btn.h) {
                if (gameState.fadeDirection === 'none') {
                  window.playSound('menu_select');
                  startFadeTransition(function() {
                    startNewGame();
                  });
                }
              }
            }

            // Layer 9: Check SHOP button click
            if (gameState._shopButtonRect) {
              var shopBtn = gameState._shopButtonRect;
              if (mouseX >= shopBtn.x && mouseX <= shopBtn.x + shopBtn.w &&
                  mouseY >= shopBtn.y && mouseY <= shopBtn.y + shopBtn.h) {
                if (gameState.fadeDirection === 'none') {
                  window.playSound('menu_select');
                  startFadeTransition(function() {
                    gameState.state = 'SHOP';
                    setState('SHOP');
                  });
                }
              }
            }
          }

          // Enter/Space handled in keydown listener (immediate dispatch)
        }

        // Layer 9: SHOP state handler
        if (gameState.state === 'SHOP') {
          gameState.titlePulseTimer += dt;

          updateTitleParticles(dt);
          updateParticles(dt);

          if (consumeKey('Escape')) {
            if (gameState.fadeDirection === 'none') {
              startFadeTransition(function() {
                goToTitle();
              });
            }
          }

          if (mouseClicked) {
            // Check upgrade card clicks
            if (gameState._shopCards) {
              for (var si = 0; si < gameState._shopCards.length; si++) {
                var sc = gameState._shopCards[si];
                if (mouseX >= sc.x && mouseX <= sc.x + sc.w &&
                    mouseY >= sc.y && mouseY <= sc.y + sc.h) {
                  if (sc.canAfford && !sc.isMaxed) {
                    purchaseShopUpgrade(sc.id);
                    window.playSound('menu_select');
                  }
                  break;
                }
              }
            }

            // Check Back button click
            if (gameState._shopBackButtonRect) {
              var backBtn = gameState._shopBackButtonRect;
              if (mouseX >= backBtn.x && mouseX <= backBtn.x + backBtn.w &&
                  mouseY >= backBtn.y && mouseY <= backBtn.y + backBtn.h) {
                if (gameState.fadeDirection === 'none') {
                  startFadeTransition(function() {
                    goToTitle();
                  });
                }
              }
            }
          }
        }

        if (gameState.state === 'PLAYING') {
          // Layer 12: FPS monitoring (before any game state updates)
          updateFpsMonitor(dt);

          // Layer 8: Pause on Escape or P
          if (consumeKey('Escape') || consumeKey('KeyP')) {
            togglePause();
          } else {
            // Update game logic
            updatePlayer(dt);
            updateCamera();
            updateWeapons(dt);
            updateEnemies(dt);
            checkCollisions();

            // Layer 12: Enforce entity cap after updates
            enforceEntityCap();

            // Layer 3: check weapon effects vs enemies
            checkWeaponEffectsVsEnemy();

            // Layer 2: update XP gems and damage numbers
            updateXPGems(dt);

            // Layer 10: Smooth XP bar interpolation
            var targetXpRatio = gameState.player.xpToNext > 0 ? gameState.player.xp / gameState.player.xpToNext : 0;
            gameState.xpBarDisplayRatio += (targetXpRatio - gameState.xpBarDisplayRatio) * Math.min(1, XP_BAR_LERP_SPEED * dt);
            // Snap if very close to avoid perpetual floating-point drift
            if (Math.abs(gameState.xpBarDisplayRatio - targetXpRatio) < 0.005) {
              gameState.xpBarDisplayRatio = targetXpRatio;
            }

            updateDamageNumbers(dt);

            // Layer 7: Update particles, screen shake, and visual overlays
            updateParticles(dt);
            updateScreenShake(dt);
            updateVisualOverlays(dt);
            spawnAmbientParticles(dt);

            // Layer 10: Update weapon pulse timers
            for (var wpKey in gameState.weaponPulseTimers) {
              if (gameState.weaponPulseTimers.hasOwnProperty(wpKey)) {
                gameState.weaponPulseTimers[wpKey] -= dt;
                if (gameState.weaponPulseTimers[wpKey] <= 0) {
                  delete gameState.weaponPulseTimers[wpKey];
                }
              }
            }

            // Layer 10: Update kill combo counter
            // Prune old kills outside the time window
            var comboWindowStart = gameState.elapsed - COMBO_TIME_WINDOW;
            while (gameState.comboKills.length > 0 && gameState.comboKills[0] < comboWindowStart) {
              gameState.comboKills.shift();
            }
            // Check if we have enough kills for a combo
            if (gameState.comboKills.length >= COMBO_KILL_THRESHOLD) {
              gameState.comboDisplayTimer = COMBO_DISPLAY_DURATION;
              gameState.comboDisplayCount = gameState.comboKills.length;
            }
            // Decrement display timer
            if (gameState.comboDisplayTimer > 0) {
              gameState.comboDisplayTimer -= dt;
            }

            // Layer 5: update pickups
            updatePickups(dt);

            // Increment elapsed time
            gameState.elapsed += dt;

            // Layer 6: Boss spawn checks and boss behavior updates
            checkBossSpawns();
            updateBosses(dt);

            // Track the game-over pulse time with actual elapsed
            gameOverPulseTime += dt;

            // Update game entity instrumentation (Layer 2-12)
            var loopBossData = getBossInstrumentationData();
            window.__GAME_STATE__.updateEntity('game', {
              state: gameState.state,
              elapsed: gameState.elapsed,
              killCount: gameState.killCount,
              enemyCount: gameState.enemies.length,
              projectileCount: gameState.projectiles.length,
              gemCount: gameState.xpGems.length,
              playerLevel: gameState.player.level,
              playerXp: gameState.player.xp,
              playerXpToNext: gameState.player.xpToNext,
              weaponCount: gameState.weapons.length,
              waveNumber: gameState.waveNumber,
              spawnRate: getCurrentSpawnRate(),
              goldCount: gameState.goldCollected,
              pickupCount: gameState.pickups.length,
              bossActive: loopBossData.bossActive,
              bossName: loopBossData.bossName,
              bossHp: loopBossData.bossHp,
              bossMaxHp: loopBossData.bossMaxHp,
              bossesDefeated: gameState.bossesDefeated,
              selectedCharacter: gameState.selectedCharacter,
              persistentGold: gameState.persistentGold,
              shopUpgradeCount: getTotalShopUpgradeCount(),
              bestTime: gameState.bestTime || 0,
              bestKills: gameState.bestKills || 0,
              bestLevel: gameState.bestLevel || 0,
              totalEntities: getTotalEntityCount(),
              fps: gameState.currentFps || 60,
              performanceDegraded: gameState.performanceDegraded || false
            });

            // Layer 2: update xp entity
            window.__GAME_STATE__.updateEntity('xp', {
              totalCollected: xpTotalCollected,
              gemsOnGround: gameState.xpGems.length
            });

            // Layer 5: update pickups entity
            updatePickupsInstrumentation();
          }
        }

        // Layer 8: PAUSED state handler
        if (gameState.state === 'PAUSED') {
          // Escape/P to unpause
          if (consumeKey('Escape') || consumeKey('KeyP')) {
            togglePause();
          }

          // Layer 12: Enter/Space selects current pause menu item
          if (gameState.state === 'PAUSED' && (consumeKey('Enter') || consumeKey('Space'))) {
            var selectedId = ['resume', 'restart', 'quit'][gameState.menuSelectedIndex || 0];
            if (selectedId === 'resume') {
              togglePause();
            } else if (selectedId === 'restart') {
              startFadeTransition(function() {
                startNewGame();
              });
            } else if (selectedId === 'quit') {
              startFadeTransition(function() {
                goToTitle();
              });
            }
          }

          // Handle pause menu button clicks
          if (mouseClicked && gameState._pauseButtons) {
            for (var pi = 0; pi < gameState._pauseButtons.length; pi++) {
              var pb = gameState._pauseButtons[pi];
              if (mouseX >= pb.x && mouseX <= pb.x + pb.w &&
                  mouseY >= pb.y && mouseY <= pb.y + pb.h) {
                window.playSound('menu_select');
                if (pb.id === 'resume') {
                  togglePause();
                } else if (pb.id === 'restart') {
                  startFadeTransition(function() {
                    startNewGame();
                  });
                } else if (pb.id === 'quit') {
                  startFadeTransition(function() {
                    goToTitle();
                  });
                }
                break;
              }
            }
          }
        }

        // Layer 2: LEVEL_UP state handler
        if (gameState.state === 'LEVEL_UP') {
          updateDamageNumbers(dt); // Let damage numbers continue floating/fading
          gameOverPulseTime += dt; // Keep pulse timer running for animations

          if (consumeKey('Digit1') && gameState.levelUpCards.length >= 1) {
            selectLevelUpCard(0);
          } else if (consumeKey('Digit2') && gameState.levelUpCards.length >= 2) {
            selectLevelUpCard(1);
          } else if (consumeKey('Digit3') && gameState.levelUpCards.length >= 3) {
            selectLevelUpCard(2);
          } else if (mouseClicked) {
            for (var ci = 0; ci < gameState.levelUpCards.length; ci++) {
              var card = gameState.levelUpCards[ci];
              if (mouseX >= card.screenX && mouseX <= card.screenX + card.screenW &&
                  mouseY >= card.screenY && mouseY <= card.screenY + card.screenH) {
                selectLevelUpCard(ci);
                break;
              }
            }
          }
          mouseClicked = false;
        }

        if (gameState.state === 'GAME_OVER' || gameState.state === 'VICTORY') {
          // Track pulse time for the restart text animation
          gameOverPulseTime += dt;

          // Layer 8: Continue returns to title screen via fade
          if (consumeKey('Enter') || consumeKey('Space')) {
            if (gameState.fadeDirection === 'none') {
              startFadeTransition(function() {
                goToTitle();
              });
            }
          }
        }

        // Layer 12: Menu navigation (runs in all states for keyboard accessibility)
        updateMenuNavigation(dt);

        // Layer 8: Update fade transitions (runs in all states)
        updateFadeTransition(dt);

        render();
        clearFrameInput();
        mouseClicked = false; // Clear mouse click flag each frame
        requestAnimationFrame(gameLoop);
      }

      // Initialize on page load
      function init() {
        var canvasEl = document.getElementById('gameCanvas');
        applyCanvasScaling();
        window.addEventListener('resize', applyCanvasScaling);

        // Layer 9: Load persistent save data from localStorage
        var saveData = loadSaveData();
        gameState.persistentGold = saveData.persistentGold;
        gameState.shopUpgrades = saveData.shopUpgrades;
        gameState.bestTime = saveData.bestTime;
        gameState.bossesEverDefeated = saveData.bossesEverDefeated;
        gameState.unlockedCharacters = saveData.unlockedCharacters;

        // Layer 12: Load best run stats from save data
        gameState.bestKills = saveData.bestKills || 0;
        gameState.bestLevel = saveData.bestLevel || 0;

        // Layer 12: Initialize menu navigation state
        gameState.menuSelectedIndex = 0;
        gameState.menuNavTimer = 0;

        // Check character unlocks (in case conditions were met in a previous session)
        checkCharacterUnlocks();

        // Layer 2: Mouse event listeners for level-up card selection
        canvasEl.addEventListener('mousemove', function(e) {
          var rect = canvasEl.getBoundingClientRect();
          mouseX = (e.clientX - rect.left) * (VIEWPORT_W / rect.width);
          mouseY = (e.clientY - rect.top) * (VIEWPORT_H / rect.height);
        });

        canvasEl.addEventListener('click', function(e) {
          var rect = canvasEl.getBoundingClientRect();
          mouseX = (e.clientX - rect.left) * (VIEWPORT_W / rect.width);
          mouseY = (e.clientY - rect.top) * (VIEWPORT_H / rect.height);
          mouseClicked = true;
        });

        // Volume slider drag support
        canvasEl.addEventListener('mousedown', function(e) {
          var rect = canvasEl.getBoundingClientRect();
          var mx = (e.clientX - rect.left) * (VIEWPORT_W / rect.width);
          var my = (e.clientY - rect.top) * (VIEWPORT_H / rect.height);
          if (gameState.state === 'TITLE' || gameState.state === 'PAUSED') {
            handleVolumeClick(mx, my, true);
          }
        });
        canvasEl.addEventListener('mousemove', function(e) {
          if (_draggingSlider) {
            var rect = canvasEl.getBoundingClientRect();
            var mx = (e.clientX - rect.left) * (VIEWPORT_W / rect.width);
            var my = (e.clientY - rect.top) * (VIEWPORT_H / rect.height);
            handleVolumeClick(mx, my, false);
          }
        });
        window.addEventListener('mouseup', function() {
          _draggingSlider = null;
        });
        function suspendSimulation() {
          simulationSuspended = true;
          lastTimestamp = 0;
        }
        function resumeSimulation() {
          simulationSuspended = false;
          lastTimestamp = 0;
        }
        document.addEventListener('visibilitychange', function() {
          if (document.hidden) suspendSimulation();
          else resumeSimulation();
        });
        window.addEventListener('blur', suspendSimulation);
        window.addEventListener('focus', resumeSimulation);

        initRenderer(canvasEl);
        initInput();
        initState();
        initEnemies();
        initWeapons();

        // Layer 8: Override to TITLE state after init (game starts at title screen)
        gameState.state = 'TITLE';
        gameState.particles = [];
        gameState.titlePulseTimer = 0;
        gameState.titleParticleTimer = 0;

        // Update game entity to reflect TITLE state
        setState('TITLE');

        // Start instrumentation
        window.__GAME_STATE__.start();

        // Start game loop
        lastTimestamp = 0;
        requestAnimationFrame(gameLoop);
      }

      // Start when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>

<script>
    (() => {
        const splashRoot = document.getElementById('rosebud-exported-splash');
        if (!splashRoot) return;

        let isReady = false;
        let isMinimumVisibleTimeElapsed = false;
        let isHidden = false;

        const maybeHideSplash = () => {
            if (isHidden || !isReady || !isMinimumVisibleTimeElapsed) return;

            isHidden = true;
            splashRoot.classList.add('is-hiding');
            window.setTimeout(() => splashRoot.remove(), 500);
        };

        const markReady = () => {
            isReady = true;
            maybeHideSplash();
        };

        window.setTimeout(() => {
            isMinimumVisibleTimeElapsed = true;
            maybeHideSplash();
        }, 1000);

        if (document.readyState === 'complete') {
            markReady();
        } else {
            window.addEventListener('load', markReady, { once: true });
        }

        
    })();
</script></body>
</html>
