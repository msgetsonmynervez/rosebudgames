      function updateProjectiles(dt) {
        var player = gameState.player;
        for (var i = 0; i < gameState.projectiles.length; i++) {
          var proj = gameState.projectiles[i];
          if (!proj.alive) continue;

          proj.age += dt;

          // Axe: apply sine-wave offset
          if (proj.type === 'axe') {
            proj.x = proj.spawnX + proj.vx * proj.age;
            proj.y = proj.baseY + proj.vy * proj.age + Math.sin(proj.age * 5 + proj.phaseOffset) * 60;
          } else {
            // Normal projectile movement
            proj.x += proj.vx * dt;
            proj.y += proj.vy * dt;
          }

          // Range check: distance from spawn point
          var distFromSpawn = Math.hypot(proj.x - proj.spawnX, proj.y - proj.spawnY);
          if (distFromSpawn > proj.maxRange) {
            proj.alive = false;
          }

          // World bounds check
          if (proj.x < -50 || proj.x > WORLD_W + 50 || proj.y < -50 || proj.y > WORLD_H + 50) {
            proj.alive = false;
          }
        }

        // Cleanup dead projectiles
        for (var i = gameState.projectiles.length - 1; i >= 0; i--) {
          if (!gameState.projectiles[i].alive) {
            gameState.projectiles.splice(i, 1);
          }
        }
      }

      function updateWeaponEffects(dt) {
        var player = gameState.player;

        for (var i = gameState.weaponEffects.length - 1; i >= 0; i--) {
          var eff = gameState.weaponEffects[i];

          // Garlic aura follows player
          if (eff.type === 'garlic_aura') {
            eff.x = player.x;
            eff.y = player.y;
          }

          // Tick lifetime
          eff.lifetime -= dt;
          if (eff.lifetime <= 0) {
            eff.alive = false;
            gameState.weaponEffects.splice(i, 1);
            continue;
          }

          // Tick damage timers for area effects
          if (eff.type === 'garlic_aura' || eff.type === 'holywater_pool') {
            eff.tickTimer += dt;
          }

          // Runic ring expansion
          if (eff.type === 'runic_ring') {
            var expansionDuration = 0.4;
            var totalLifetime = eff.maxLifetime;
            var elapsed = totalLifetime - eff.lifetime;
            eff.expandProgress = Math.min(1, elapsed / expansionDuration);
          }
        }
      }

      // =====================================================================
      // COLLISION (collision.js)
      // =====================================================================
      function checkCollisions() {
        checkProjectileVsEnemy();
        checkEnemyVsPlayer();
      }

      function checkProjectileVsEnemy() {
        var projectiles = gameState.projectiles;
        var enemies = gameState.enemies;

        for (var i = 0; i < projectiles.length; i++) {
          var proj = projectiles[i];
          if (!proj.alive) continue;

          for (var j = 0; j < enemies.length; j++) {
            var enemy = enemies[j];
            if (!enemy.alive) continue;

            // Layer 3: skip already-hit enemies for piercing projectiles
            if (proj.piercing && proj.hitEnemies.indexOf(enemy.spawnId) !== -1) continue;

            var dist = Math.hypot(proj.x - enemy.x, proj.y - enemy.y);

            if (dist < proj.radius + enemy.radius) {
              // Hit: damage enemy with damage multiplier and crit system (Layer 2)
              var isCrit = Math.random() < gameState.player.critChance;
              var dmg = Math.floor(proj.damage * gameState.player.damage);
              if (isCrit) dmg = Math.floor(dmg * CRIT_MULTIPLIER);

              // Layer 4: Apply ghost projectile resistance
              if (enemy.projectileResistance > 0) {
                dmg = Math.max(1, Math.floor(dmg * (1 - enemy.projectileResistance)));
              }

              enemy.hp -= dmg;
              spawnDamageNumber(enemy.x, enemy.y - 10, dmg, isCrit);
              enemy.flashTimer = 0.1;

              // Layer 7: Crit particle burst, flash, and shake
              if (isCrit) {
                spawnParticleBurst(enemy.x, enemy.y, PARTICLE_CRIT_BURST_COUNT, '#ffee00', 60, 150, 1, 3, 0.25, { gravity: 0 });
                if (gameState.critFlashCooldown <= 0) {
                  gameState.critFlashTimer = CRIT_FLASH_DURATION;
                  gameState.critFlashCooldown = CRIT_FLASH_COOLDOWN;
                }
                triggerScreenShake(SHAKE_MEDIUM_INTENSITY, SHAKE_MEDIUM_DURATION);
              }

              if (enemy.hp <= 0) {
                enemy.alive = false;
                spawnXPGem(enemy.x, enemy.y, enemy.xpSize || determineGemSize());
                rollPickupDrops(enemy);
                gameState.killCount++;
                // Layer 10: Track kill timestamp for combo counter
                gameState.comboKills.push(gameState.elapsed);
                // Layer 4: Slime split on death
                if (enemy.splitOnDeath && !enemy.isSmall) {
                  spawnSplitSlimes(enemy);
                  window.playSound('slime_split');
                }
                // Layer 6: Boss death handling
                if (enemy.isBoss) {
                  handleBossDeath(enemy);
                  window.playSound('boss_die');
                }
                // Layer 7: Enemy death particles
                var deathColor = ENEMY_DEFS[enemy.type] ? ENEMY_DEFS[enemy.type].color : '#d4c9a8';
                var deathCount = enemy.isBoss ? PARTICLE_BOSS_DEATH_COUNT : PARTICLE_ENEMY_DEATH_COUNT;
                var deathSpeed = enemy.isBoss ? 200 : 120;
                spawnParticleBurst(enemy.x, enemy.y, deathCount, deathColor, 40, deathSpeed, 2, 4, 0.4, { gravity: 80 });
                if (enemy.isBoss) {
                  triggerScreenShake(SHAKE_BOSS_DEATH_INTENSITY, SHAKE_BOSS_DEATH_DURATION);
                }
              } else {
                window.playSound('enemy_hit');
              }

              // Layer 3: piercing projectiles pass through
              if (proj.piercing) {
                proj.hitEnemies.push(enemy.spawnId);
                // Do NOT destroy, do NOT break
              } else {
                // Layer 7: Weapon impact particles (non-piercing hit)
                spawnParticleBurst(proj.x, proj.y, 2, '#ffffff', 30, 60, 1, 2, 0.15, { gravity: 0 });
                proj.alive = false;
                break; // Non-piercing (knife) consumed on first hit
              }
            }
          }
        }
      }

      // Layer 3: Check weapon effects vs enemies
      function checkWeaponEffectsVsEnemy() {
        var player = gameState.player;
        var enemies = gameState.enemies;

        for (var i = 0; i < gameState.weaponEffects.length; i++) {
          var eff = gameState.weaponEffects[i];
          if (!eff.alive) continue;

          // --- Garlic Aura: tick-based, radius check ---
          if (eff.type === 'garlic_aura' && eff.tickTimer >= eff.tickRate) {
            eff.tickTimer -= eff.tickRate;
            for (var j = 0; j < enemies.length; j++) {
              var enemy = enemies[j];
              if (!enemy.alive) continue;
              var dist = Math.hypot(enemy.x - eff.x, enemy.y - eff.y);
              if (dist < eff.radius) {
                applyWeaponDamage(enemy, eff.damage);
              }
            }
          }

          // --- Holy Water Pool: tick-based, radius check ---
          if (eff.type === 'holywater_pool' && eff.tickTimer >= eff.tickRate) {
            eff.tickTimer -= eff.tickRate;
            for (var j = 0; j < enemies.length; j++) {
              var enemy = enemies[j];
              if (!enemy.alive) continue;
              var dist = Math.hypot(enemy.x - eff.x, enemy.y - eff.y);
              if (dist < eff.radius) {
                applyWeaponDamage(enemy, eff.damage);
              }
            }
          }

          // --- Whip Slash: one-time hit per enemy, rectangular check ---
          if (eff.type === 'whip_slash') {
            var slashCenterX = eff.x + eff.facingX * (eff.width / 2);
            var slashCenterY = eff.y;
            for (var j = 0; j < enemies.length; j++) {
              var enemy = enemies[j];
              if (!enemy.alive) continue;
              if (eff.hitEnemies.indexOf(enemy.spawnId) !== -1) continue;
              // AABB check
              if (Math.abs(enemy.x - slashCenterX) < (eff.width / 2 + enemy.radius) &&
                  Math.abs(enemy.y - slashCenterY) < (eff.height / 2 + enemy.radius)) {
                eff.hitEnemies.push(enemy.spawnId);
                applyWeaponDamage(enemy, eff.damage);
              }
            }
          }

          // --- Runic Ring: one-time hit per enemy, expanding ring check ---
          if (eff.type === 'runic_ring') {
            var currentRadius = eff.expandProgress * eff.maxRadius;
            for (var j = 0; j < enemies.length; j++) {
              var enemy = enemies[j];
              if (!enemy.alive) continue;
              if (eff.hitEnemies.indexOf(enemy.spawnId) !== -1) continue;
              var dist = Math.hypot(enemy.x - eff.x, enemy.y - eff.y);
              if (dist >= currentRadius - 15 && dist <= currentRadius + 15) {
                eff.hitEnemies.push(enemy.spawnId);
                applyWeaponDamage(enemy, eff.damage);
              }
            }
          }

          // Lightning damage is applied instantly at fire time, not here
        }
      }

      // Layer 3: Centralized damage calculation for weapon effects
      // NOTE: No projectileResistance applied here (weapon effects deal full damage to ghosts)
      function applyWeaponDamage(enemy, baseDamage) {
        var isCrit = Math.random() < gameState.player.critChance;
        var dmg = Math.floor(baseDamage * gameState.player.damage);
        if (isCrit) dmg = Math.floor(dmg * CRIT_MULTIPLIER);
        enemy.hp -= dmg;
        spawnDamageNumber(enemy.x, enemy.y - 10, dmg, isCrit);
        enemy.flashTimer = 0.1;

        // Layer 7: Crit particle burst, flash, and shake
        if (isCrit) {
          spawnParticleBurst(enemy.x, enemy.y, PARTICLE_CRIT_BURST_COUNT, '#ffee00', 60, 150, 1, 3, 0.25, { gravity: 0 });
          if (gameState.critFlashCooldown <= 0) {
            gameState.critFlashTimer = CRIT_FLASH_DURATION;
            gameState.critFlashCooldown = CRIT_FLASH_COOLDOWN;
          }
          triggerScreenShake(SHAKE_MEDIUM_INTENSITY, SHAKE_MEDIUM_DURATION);
        }

        if (enemy.hp <= 0) {
          enemy.alive = false;
          spawnXPGem(enemy.x, enemy.y, enemy.xpSize || determineGemSize());
          rollPickupDrops(enemy);
          gameState.killCount++;
          // Layer 10: Track kill timestamp for combo counter
          gameState.comboKills.push(gameState.elapsed);
          // Layer 4: Slime split on death
          if (enemy.splitOnDeath && !enemy.isSmall) {
            spawnSplitSlimes(enemy);
            window.playSound('slime_split');
          }
          // Layer 6: Boss death handling
          if (enemy.isBoss) {
            handleBossDeath(enemy);
            window.playSound('boss_die');
          }
          // Layer 7: Enemy death particles
          var deathColor = ENEMY_DEFS[enemy.type] ? ENEMY_DEFS[enemy.type].color : '#d4c9a8';
          var deathCount = enemy.isBoss ? PARTICLE_BOSS_DEATH_COUNT : PARTICLE_ENEMY_DEATH_COUNT;
          var deathSpeed = enemy.isBoss ? 200 : 120;
          spawnParticleBurst(enemy.x, enemy.y, deathCount, deathColor, 40, deathSpeed, 2, 4, 0.4, { gravity: 80 });
          if (enemy.isBoss) {
            triggerScreenShake(SHAKE_BOSS_DEATH_INTENSITY, SHAKE_BOSS_DEATH_DURATION);
          }
        } else {
          window.playSound('enemy_hit');
        }
      }

      function checkEnemyVsPlayer() {
        var player = gameState.player;
        if (!player) return;

        var enemies = gameState.enemies;

        for (var i = 0; i < enemies.length; i++) {
          var enemy = enemies[i];
          if (!enemy.alive) continue;

          var dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);

          if (dist < enemy.radius + player.radius) {
            damagePlayer(enemy.contactDamage);
          }
        }
      }

      // =====================================================================
      // XP GEMS (Layer 2)
      // =====================================================================
      function initXPGems() {
        gameState.xpGems = [];
      }

      function spawnXPGem(worldX, worldY, gemSize) {
        var value = gemSize === 'large' ? XP_GEM_LARGE : gemSize === 'medium' ? XP_GEM_MEDIUM : XP_GEM_SMALL;
        gameState.xpGems.push({
          x: worldX + (Math.random() - 0.5) * 16,
          y: worldY + (Math.random() - 0.5) * 16,
          value: value,
          size: gemSize,
          alive: true,
          magnetSpeed: 0,
          magnetized: false,
          sparklePhase: Math.random() * Math.PI * 2,
          age: 0
        });
      }

      function determineGemSize() {
        var elapsed = gameState.elapsed;
        var roll = Math.random();
        if (elapsed >= 600) {
          if (roll < 0.15) return 'large';
          if (roll < 0.50) return 'medium';
          return 'small';
        } else if (elapsed >= 180) {
          if (roll < 0.30) return 'medium';
          return 'small';
        }
        return 'small';
      }

      function updateXPGems(dt) {
        var player = gameState.player;
        if (!player) return;

        for (var i = gameState.xpGems.length - 1; i >= 0; i--) {
          var gem = gameState.xpGems[i];
          if (!gem.alive) {
            gameState.xpGems.splice(i, 1);
            continue;
          }

          gem.age += dt;

          var dx = player.x - gem.x;
          var dy = player.y - gem.y;
          var distance = Math.hypot(dx, dy);

          if (distance <= player.pickupRadius) {
            gem.magnetized = true;
          }

          if (gem.magnetized) {
            gem.magnetSpeed = Math.min(gem.magnetSpeed + PICKUP_ACCEL * dt, PICKUP_SPEED_MAX);

            if (distance > 0) {
              var dirX = dx / distance;
              var dirY = dy / distance;
              gem.x += dirX * gem.magnetSpeed * dt;
              gem.y += dirY * gem.magnetSpeed * dt;
            }

            // Recalculate distance after movement
            var newDist = Math.hypot(player.x - gem.x, player.y - gem.y);
            if (newDist <= GEM_COLLECT_RADIUS) {
              collectGem(gem);
            }
          }
        }
      }

      function collectGem(gem) {
        gem.alive = false;

        // Layer 7: Gem collection sparkle
        var gemColor = gem.size === 'large' ? '#ccddff' : gem.size === 'medium' ? '#22ddff' : '#4488ff';
        spawnParticleBurst(gem.x, gem.y, PARTICLE_PICKUP_BURST_COUNT, gemColor, 30, 80, 1, 2, 0.3, { gravity: 0 });
        window.playSound('xp_pickup');

        // Layer 9: Apply XP gain multiplier
        var xpValue = gem.value;
        if (gameState.player.xpGainMultiplier && gameState.player.xpGainMultiplier > 1) {
          xpValue = Math.floor(gem.value * gameState.player.xpGainMultiplier);
          if (xpValue < gem.value + 1) xpValue = gem.value;
        }
        gameState.player.xp += xpValue;
        xpTotalCollected += xpValue;

        // Update xp entity
        window.__GAME_STATE__.updateEntity('xp', {
          totalCollected: xpTotalCollected,
          gemsOnGround: gameState.xpGems.length
        });

        checkLevelUp();
      }

      function checkLevelUp() {
        var player = gameState.player;
        if (player.xp >= player.xpToNext) {
          player.xp -= player.xpToNext;
          player.level += 1;
          player.xpToNext = Math.floor(5 * player.level + 0.5 * player.level * player.level); // Layer 11: quadratic XP curve

          // Layer 10: Reset smooth XP bar display on level-up
          gameState.xpBarDisplayRatio = 0;

          // Layer 7: Level-up particle ring and flash
          spawnParticleRing(player.x, player.y, PARTICLE_LEVELUP_RING_COUNT, '#e8c849', 120, 3, 0.5);
          gameState.levelUpFlashTimer = LEVELUP_FLASH_DURATION;

          window.playSound('level_up');
          generateLevelUpCards();
          setState('LEVEL_UP');
        }
      }

      // =====================================================================
      // DAMAGE NUMBERS (Layer 2)
      // =====================================================================
      function initDamageNumbers() {
        gameState.damageNumbers = [];
      }

      function spawnDamageNumber(worldX, worldY, value, isCrit) {
        gameState.damageNumbers.push({
          x: worldX,
          y: worldY,
          value: value,
          isCrit: isCrit,
          lifetime: DAMAGE_NUMBER_LIFETIME,
          driftX: (Math.random() - 0.5) * 2 * DAMAGE_NUMBER_DRIFT,
          alpha: 1.0
        });
      }

      function updateDamageNumbers(dt) {
        for (var i = gameState.damageNumbers.length - 1; i >= 0; i--) {
          var dn = gameState.damageNumbers[i];
          dn.y -= DAMAGE_NUMBER_RISE_SPEED * dt;
          dn.x += dn.driftX * dt;
          dn.lifetime -= dt;
          dn.alpha = Math.max(0, dn.lifetime / DAMAGE_NUMBER_LIFETIME);
          if (dn.lifetime <= 0) {
            gameState.damageNumbers.splice(i, 1);
          }
        }
      }

      // =====================================================================
      // PICKUPS (Layer 5)
      // =====================================================================

      function rollPickupDrops(enemy) {
        var def = ENEMY_DEFS[enemy.type];
        // Layer 6: Use enemy.tier directly if set (bosses have tier=5), otherwise fall back to def
        var tier = enemy.tier || (def ? def.tier : 1);

        // Gold coin: 30% chance from any enemy
        if (Math.random() < GOLD_DROP_CHANCE) {
          var goldValue = tier >= 3 ? GOLD_VALUE_HIGH : GOLD_VALUE_BASE;
          spawnPickup('coin', enemy.x, enemy.y, { value: goldValue });
        }

        // Heart: 2% chance from any enemy
        if (Math.random() < HEART_DROP_CHANCE) {
          spawnPickup('heart', enemy.x, enemy.y, {});
        }

        // Magnet: 0.5% chance from Tier 3+ enemies only
        if (tier >= 3 && Math.random() < MAGNET_DROP_CHANCE) {
          spawnPickup('magnet', enemy.x, enemy.y, {});
        }

        // Treasure chest: 5% chance from Tier 3+ enemies only
        if (tier >= 3 && Math.random() < CHEST_DROP_CHANCE) {
          spawnPickup('chest', enemy.x, enemy.y, {});
        }
      }

      function spawnPickup(pickupType, worldX, worldY, opts) {
        var pickup = {
          x: worldX + (Math.random() - 0.5) * 20,
          y: worldY + (Math.random() - 0.5) * 20,
          type: pickupType,
          alive: true,
          age: 0,
          magnetSpeed: 0,
          magnetized: false,
          sparklePhase: Math.random() * Math.PI * 2,
          bobPhase: Math.random() * Math.PI * 2,
          glowPhase: Math.random() * Math.PI * 2,
          value: opts.value || 0
        };
        gameState.pickups.push(pickup);
      }

      function updatePickups(dt) {
        var player = gameState.player;
        if (!player) return;

        for (var i = gameState.pickups.length - 1; i >= 0; i--) {
          var pickup = gameState.pickups[i];
          if (!pickup.alive) {
            gameState.pickups.splice(i, 1);
            continue;
          }

          pickup.age += dt;

          var dx = player.x - pickup.x;
          var dy = player.y - pickup.y;
          var distance = Math.hypot(dx, dy);

          // --- Magnetic behavior for coins (same as XP gems) ---
          if (pickup.type === 'coin') {
            if (distance <= player.pickupRadius) {
              pickup.magnetized = true;
            }

            if (pickup.magnetized) {
              pickup.magnetSpeed = Math.min(pickup.magnetSpeed + PICKUP_ACCEL * dt, PICKUP_SPEED_MAX);
              if (distance > 0) {
                var dirX = dx / distance;
                var dirY = dy / distance;
                pickup.x += dirX * pickup.magnetSpeed * dt;
                pickup.y += dirY * pickup.magnetSpeed * dt;
              }
              // Recalculate distance after movement
              var newDist = Math.hypot(player.x - pickup.x, player.y - pickup.y);
              if (newDist <= GEM_COLLECT_RADIUS) {
                collectPickup(pickup);
              }
            }
          }

          // --- Walk-over collection for hearts, magnets, chests ---
          if (pickup.type === 'heart' || pickup.type === 'magnet' || pickup.type === 'chest') {
            if (distance <= PICKUP_COLLECT_RADIUS + player.radius) {
              collectPickup(pickup);
            }
          }
        }
      }

      function collectPickup(pickup) {
        pickup.alive = false;
        gameState.pickupsCollected++;

        // Layer 7: Pickup collection particles
        if (pickup.type === 'coin') {
          spawnParticleBurst(pickup.x, pickup.y, PARTICLE_PICKUP_BURST_COUNT, '#ffcc00', 30, 80, 1, 2, 0.3, { gravity: 0 });
        } else if (pickup.type === 'heart') {
          spawnParticleBurst(pickup.x, pickup.y, 3, '#ff2244', 20, 50, 2, 3, 0.5, { gravity: -40 });
        } else if (pickup.type === 'magnet') {
          spawnParticleBurst(pickup.x, pickup.y, PARTICLE_PICKUP_BURST_COUNT, '#4488ff', 40, 100, 1, 3, 0.4, { gravity: 0 });
        } else if (pickup.type === 'chest') {
          spawnParticleBurst(pickup.x, pickup.y, 8, '#e8c849', 40, 120, 2, 4, 0.5, { gravity: 0 });
        }

        if (pickup.type === 'coin') {
          gameState.goldCollected += pickup.value;
          gameState.player.gold += pickup.value;
          window.playSound('gold_pickup');
        } else if (pickup.type === 'heart') {
          var player = gameState.player;
          player.hp = Math.min(player.hp + HEART_HEAL_AMOUNT, player.maxHp);
          // Update player instrumentation immediately for HP change
          updatePlayerInstrumentation();
          window.playSound('heart_pickup');
        } else if (pickup.type === 'magnet') {
          activateMagnet();
          window.playSound('magnet_pickup');
        } else if (pickup.type === 'chest') {
          openTreasureChest();
          window.playSound('chest_open');
        }

        // Update pickups instrumentation
        updatePickupsInstrumentation();
      }

      function activateMagnet() {
        // Magnetize all XP gems on the ground
        for (var i = 0; i < gameState.xpGems.length; i++) {
          var gem = gameState.xpGems[i];
          if (gem.alive) {
            gem.magnetized = true;
            gem.magnetSpeed = PICKUP_SPEED_MAX; // Instant rush
          }
        }

        // Magnetize all gold coins on the ground
        for (var i = 0; i < gameState.pickups.length; i++) {
          var pickup = gameState.pickups[i];
          if (pickup.alive && pickup.type === 'coin') {
            pickup.magnetized = true;
            pickup.magnetSpeed = PICKUP_SPEED_MAX; // Instant rush
          }
        }
      }

      function openTreasureChest() {
        var player = gameState.player;

        // 50% chance for weapon upgrade, 50% for gold
        // But if no weapon upgrades are available, always give gold
        var upgradeableWeapons = [];
        for (var i = 0; i < gameState.weapons.length; i++) {
          if (gameState.weapons[i].level < 5) {
            upgradeableWeapons.push(i);
          }
        }

        if (upgradeableWeapons.length > 0 && Math.random() < 0.5) {
          // Upgrade a random held weapon
          var idx = upgradeableWeapons[Math.floor(Math.random() * upgradeableWeapons.length)];
          gameState.weapons[idx].level++;
          player.weapons = gameState.weapons.map(function(w) { return {id: w.id, level: w.level}; });
        } else {
          // Gold bonus
          gameState.goldCollected += CHEST_GOLD_BONUS;
          player.gold += CHEST_GOLD_BONUS;
        }

        // Update player instrumentation with new weapon levels or gold
        updatePlayerInstrumentation();
      }

      function updatePlayerInstrumentation() {
        var player = gameState.player;
        window.__GAME_STATE__.updateEntity('player', {
          x: player.x,
          y: player.y,
          hp: player.hp,
          maxHp: player.maxHp,
          speed: player.speed,
          invulnTimer: player.invulnTimer,
          facingX: player.facingX,
          facingY: player.facingY,
          xp: player.xp,
          level: player.level,
          xpToNext: player.xpToNext,
          pickupRadius: player.pickupRadius,
          damage: player.damage,
          critChance: player.critChance,
          cooldownReduction: player.cooldownReduction,
          armor: player.armor,
          weapons: gameState.weapons.map(function(w) { return {id: w.id, level: w.level}; }),
          weaponCount: gameState.weapons.length,
          gold: player.gold,
          characterId: player.characterId || gameState.selectedCharacter,
          xpGainMultiplier: player.xpGainMultiplier || 1.0
        });
      }

      function updatePickupsInstrumentation() {
        var coins = 0, hearts = 0, magnets = 0, chests = 0;
        for (var i = 0; i < gameState.pickups.length; i++) {
          var p = gameState.pickups[i];
          if (!p.alive) continue;
          if (p.type === 'coin') coins++;
          else if (p.type === 'heart') hearts++;
          else if (p.type === 'magnet') magnets++;
          else if (p.type === 'chest') chests++;
        }
        window.__GAME_STATE__.updateEntity('pickups', {
          coinsOnGround: coins,
          heartsOnGround: hearts,
          magnetsOnGround: magnets,
          chestsOnGround: chests,
          totalCollected: gameState.pickupsCollected
        });
      }

      // =====================================================================
      // BOSSES (Layer 6)
      // =====================================================================

      function getBossInstrumentationData() {
        var bossActive = false;
        var bossName = '';
        var bossHp = 0;
        var bossMaxHp = 0;
        for (var i = 0; i < gameState.enemies.length; i++) {
          var e = gameState.enemies[i];
          if (e.isBoss && e.alive) {
            bossActive = true;
            bossName = e.bossName;
            bossHp = e.hp;
            bossMaxHp = e.maxHp;
            break;
          }
        }
        return { bossActive: bossActive, bossName: bossName, bossHp: bossHp, bossMaxHp: bossMaxHp };
      }

      function checkBossSpawns() {
        var elapsed = gameState.elapsed;

        // Boss 1: Giant Skeleton at minute 10
        if (elapsed >= BOSS_1_TIME && !gameState.bossSpawned.boss1) {
          gameState.bossSpawned.boss1 = true;
          spawnBoss('giant_skeleton');
        }

        // Boss 2: Demon Lord at minute 20
        if (elapsed >= BOSS_2_TIME && !gameState.bossSpawned.boss2) {
          gameState.bossSpawned.boss2 = true;
          spawnBoss('demon_lord');
        }

        // Boss 3: Final Boss at minute 25
        if (elapsed >= BOSS_3_TIME && !gameState.bossSpawned.boss3) {
          gameState.bossSpawned.boss3 = true;
          spawnBoss('final_boss');
        }

        // Victory by survival: minute 30
        if (elapsed >= VICTORY_TIME && gameState.state === 'PLAYING') {
          setState('VICTORY');
        }
      }

      function spawnBoss(bossId) {
        var player = gameState.player;
        if (!player) return;
        window.playSound('boss_roar');

        // Pick spawn position: random edge, at least 300px from player
        var cam = gameState.camera;
        var edge = Math.floor(Math.random() * 4);
        var sx, sy;

        switch (edge) {
          case 0: sx = cam.x + Math.random() * VIEWPORT_W; sy = cam.y - 80; break;
          case 1: sx = cam.x + Math.random() * VIEWPORT_W; sy = cam.y + VIEWPORT_H + 80; break;
          case 2: sx = cam.x - 80; sy = cam.y + Math.random() * VIEWPORT_H; break;
          case 3: sx = cam.x + VIEWPORT_W + 80; sy = cam.y + Math.random() * VIEWPORT_H; break;
        }

        sx = Math.max(50, Math.min(WORLD_W - 50, sx));
        sy = Math.max(50, Math.min(WORLD_H - 50, sy));

        var boss;
        var minutes = gameState.elapsed / 60;
        var hpScale = 1 + ENEMY_HP_SCALE_PER_MIN * minutes;

        if (bossId === 'giant_skeleton') {
          var baseHp = ENEMY_DEFS['skeleton'].baseHp;
          boss = createEnemy('skeleton', sx, sy);
          boss.isBoss = true;
          boss.bossId = 'giant_skeleton';
          boss.bossName = 'Giant Skeleton';
          boss.hp = Math.floor(baseHp * hpScale * BOSS_1_HP_MULTIPLIER);
          boss.maxHp = boss.hp;
          boss.speed = BOSS_1_SPEED;
          boss.contactDamage = BOSS_CONTACT_DAMAGE;
          boss.width = Math.floor(32 * BOSS_1_SIZE_SCALE);
          boss.height = Math.floor(32 * BOSS_1_SIZE_SCALE);
          boss.radius = Math.floor(12 * BOSS_1_SIZE_SCALE);
          boss.sizeScale = BOSS_1_SIZE_SCALE;
          boss.tier = 5;
          boss.xpSize = 'large';
          boss.behavior = 'chase';
          boss.splitOnDeath = false;

        } else if (bossId === 'demon_lord') {
          var baseHp = ENEMY_DEFS['demon'].baseHp;
          boss = createEnemy('demon', sx, sy);
          boss.isBoss = true;
          boss.bossId = 'demon_lord';
          boss.bossName = 'Demon Lord';
          boss.hp = Math.floor(baseHp * hpScale * BOSS_2_HP_MULTIPLIER);
          boss.maxHp = boss.hp;
          boss.speed = BOSS_2_SPEED;
          boss.contactDamage = BOSS_CONTACT_DAMAGE;
          boss.width = Math.floor(32 * BOSS_2_SIZE_SCALE);
          boss.height = Math.floor(32 * BOSS_2_SIZE_SCALE);
          boss.radius = Math.floor(12 * BOSS_2_SIZE_SCALE);
          boss.sizeScale = BOSS_2_SIZE_SCALE;
          boss.tier = 5;
          boss.xpSize = 'large';
          boss.behavior = 'chase';
          boss.bossSpawnTimer = 0;
          boss.bossSpawnInterval = BOSS_2_SPAWN_INTERVAL;
          boss.bossSpawnCount = BOSS_2_SPAWN_COUNT;
          boss.splitOnDeath = false;
          boss.chargeState = 'approaching';

        } else if (bossId === 'final_boss') {
          var baseHp = ENEMY_DEFS['demon'].baseHp;
          boss = createEnemy('demon', sx, sy);
          boss.isBoss = true;
          boss.bossId = 'final_boss';
          boss.bossName = 'Demon Overlord';
          boss.hp = Math.floor(baseHp * hpScale * BOSS_3_HP_MULTIPLIER);
          boss.maxHp = boss.hp;
          boss.speed = BOSS_3_SPEED_PHASE1;
          boss.contactDamage = BOSS_CONTACT_DAMAGE;
          boss.width = Math.floor(32 * BOSS_3_SIZE_SCALE);
          boss.height = Math.floor(32 * BOSS_3_SIZE_SCALE);
          boss.radius = Math.floor(12 * BOSS_3_SIZE_SCALE);
          boss.sizeScale = BOSS_3_SIZE_SCALE;
          boss.tier = 5;
          boss.xpSize = 'large';
          boss.behavior = 'chase';
          boss.bossPhase = 1;
          boss.bossSpawnTimer = 0;
          boss.bossSpawnInterval = BOSS_3_SPAWN_INTERVAL_P1;
          boss.bossSpawnCount = BOSS_3_SPAWN_COUNT;
          boss.splitOnDeath = false;
          boss.damageAura = false;
          boss.auraRadius = BOSS_3_AURA_RADIUS;
          boss.auraDamage = BOSS_3_AURA_DAMAGE;
          boss.auraTickRate = BOSS_3_AURA_TICK_RATE;
          boss.auraTimer = 0;
          boss.chargeState = 'approaching';
        }

        gameState.enemies.push(boss);

        // Layer 7: Boss arrival screen shake
        triggerScreenShake(SHAKE_HEAVY_INTENSITY, SHAKE_HEAVY_DURATION);
      }

      function updateBosses(dt) {
        var player = gameState.player;
        if (!player) return;

        for (var i = 0; i < gameState.enemies.length; i++) {
          var enemy = gameState.enemies[i];
          if (!enemy.isBoss || !enemy.alive) continue;

          // --- Demon Lord and Final Boss: minion spawning ---
          if (enemy.bossSpawnInterval && enemy.bossSpawnInterval > 0) {
            enemy.bossSpawnTimer += dt;
            if (enemy.bossSpawnTimer >= enemy.bossSpawnInterval) {
              enemy.bossSpawnTimer -= enemy.bossSpawnInterval;
              spawnBossMinions(enemy);
            }
          }

          // --- Final Boss: phase 2 transition ---
          if (enemy.bossId === 'final_boss' && enemy.bossPhase === 1) {
            if (enemy.hp <= enemy.maxHp * 0.5) {
              enemy.bossPhase = 2;
              enemy.speed = BOSS_3_SPEED_PHASE2;
              enemy.bossSpawnInterval = BOSS_3_SPAWN_INTERVAL_P2;
              enemy.damageAura = true;
              enemy.bossName = 'Demon Overlord (Enraged)';
            }
          }
        }
      }

      function spawnBossMinions(boss) {
        var count = boss.bossSpawnCount || 3;
        count = Math.min(count, MAX_ENEMIES_LAYER4 - gameState.enemies.length);
        if (count <= 0) return;

        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
          var dist = 60 + Math.random() * 40;
          var mx = boss.x + Math.cos(angle) * dist;
          var my = boss.y + Math.sin(angle) * dist;
          mx = Math.max(0, Math.min(WORLD_W, mx));
          my = Math.max(0, Math.min(WORLD_H, my));

          var minion = createEnemy('demon', mx, my);
          gameState.enemies.push(minion);
        }
      }

      function handleBossDeath(boss) {
        gameState.bossesDefeated++;

        // Shower of XP gems
        for (var i = 0; i < BOSS_XP_GEM_COUNT; i++) {
          var angle = (Math.PI * 2 / BOSS_XP_GEM_COUNT) * i;
          var dist = 20 + Math.random() * 30;
          spawnXPGem(
            boss.x + Math.cos(angle) * dist,
            boss.y + Math.sin(angle) * dist,
            'large'
          );
        }

        // Shower of gold coins
        for (var i = 0; i < BOSS_GOLD_DROP_COUNT; i++) {
          spawnPickup('coin', boss.x + (Math.random() - 0.5) * 60,
            boss.y + (Math.random() - 0.5) * 60,
            { value: GOLD_VALUE_HIGH });
        }

        // Drop a guaranteed treasure chest
        spawnPickup('chest', boss.x, boss.y, {});

        // If final boss is defeated, trigger victory
        if (boss.bossId === 'final_boss') {
          setState('VICTORY');
        }
      }

      // =====================================================================
      // PARTICLES AND VISUAL JUICE (Layer 7)
      // =====================================================================

      function spawnParticle(x, y, vx, vy, color, size, lifetime, opts) {
        // Layer 12: Performance degradation reduces particle cap
        var effectiveMaxParticles = gameState.performanceDegraded ? DEGRADED_MAX_PARTICLES : MAX_PARTICLES;
        if (gameState.particles.length >= effectiveMaxParticles) {
          if (gameState.particles.length >= MAX_PARTICLES) {
            gameState.particles.shift(); // Remove oldest particle
          } else {
            return; // Skip spawning under degraded cap
          }
        }
        var p = {
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          color: color,
          size: size,
          lifetime: lifetime,
          maxLifetime: lifetime,
          alive: true,
          gravity: (opts && opts.gravity) || 0,
          shrink: (opts && opts.shrink !== undefined) ? opts.shrink : true,
          fadeOut: (opts && opts.fadeOut !== undefined) ? opts.fadeOut : true,
          isAmbient: (opts && opts.isAmbient) || false
        };
        gameState.particles.push(p);
      }

      function spawnParticleBurst(x, y, count, color, speedMin, speedMax, sizeMin, sizeMax, lifetime, opts) {
        for (var i = 0; i < count; i++) {
          var angle = Math.random() * Math.PI * 2;
          var speed = speedMin + Math.random() * (speedMax - speedMin);
          var vx = Math.cos(angle) * speed;
          var vy = Math.sin(angle) * speed;
          var size = sizeMin + Math.random() * (sizeMax - sizeMin);
          spawnParticle(x, y, vx, vy, color, size, lifetime + Math.random() * 0.1, opts);
        }
      }

      function spawnParticleRing(x, y, count, color, speed, size, lifetime) {
        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 / count) * i;
          var vx = Math.cos(angle) * speed;
          var vy = Math.sin(angle) * speed;
          spawnParticle(x, y, vx, vy, color, size, lifetime, { gravity: 0, shrink: true, fadeOut: true });
        }
      }

      function updateParticles(dt) {
        for (var i = gameState.particles.length - 1; i >= 0; i--) {
          var p = gameState.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += p.gravity * dt;
          p.lifetime -= dt;
          if (p.lifetime <= 0) {
            p.alive = false;
            gameState.particles.splice(i, 1);
          }
        }
      }

      function spawnAmbientParticles(dt) {
        // Count current ambient particles
        var ambientCount = 0;
        for (var i = 0; i < gameState.particles.length; i++) {
          if (gameState.particles[i].isAmbient) ambientCount++;
        }
        if (ambientCount >= PARTICLE_AMBIENT_MAX) return;

        gameState.ambientParticleTimer += dt;
        if (gameState.ambientParticleTimer >= 1.0 / PARTICLE_AMBIENT_SPAWN_RATE) {
          gameState.ambientParticleTimer -= 1.0 / PARTICLE_AMBIENT_SPAWN_RATE;

          // Spawn near a random position within the viewport
          var cam = gameState.camera;
          var ax = cam.x + Math.random() * VIEWPORT_W;
          var ay = cam.y + Math.random() * VIEWPORT_H;

          // Slow drift in a random direction
          var driftAngle = Math.random() * Math.PI * 2;
          var driftSpeed = 5 + Math.random() * 10;

          spawnParticle(
            ax, ay,
            Math.cos(driftAngle) * driftSpeed,
            Math.sin(driftAngle) * driftSpeed,
            '#aabb99',  // muted green-grey dust mote
            1 + Math.random() * 1.5,
            3 + Math.random() * 4,  // long lifetime (3-7 seconds)
            { gravity: 0, shrink: false, fadeOut: true, isAmbient: true }
          );
        }
      }

      function triggerScreenShake(intensity, duration) {
        // Boss-level shakes (intensity >= 6) bypass cooldown
        if (intensity < SHAKE_HEAVY_INTENSITY && gameState.shakeCooldown > 0) return;

        // Calculate remaining intensity of current shake
        var remaining = 0;
        if (gameState.screenShake.timer < gameState.screenShake.duration) {
          var progress = gameState.screenShake.timer / gameState.screenShake.duration;
          remaining = gameState.screenShake.intensity * (1 - progress);
        }

        // Only override if new shake is stronger
        if (intensity > remaining) {
          gameState.screenShake.intensity = intensity;
          gameState.screenShake.duration = duration;
          gameState.screenShake.timer = 0;
          gameState.shakeCooldown = SHAKE_COOLDOWN;
        }
      }

      function updateScreenShake(dt) {
        if (gameState.screenShake.timer < gameState.screenShake.duration) {
          gameState.screenShake.timer += dt;
        }
      }

      function getShakeOffset() {
        if (gameState.screenShake.timer >= gameState.screenShake.duration) {
          return { x: 0, y: 0 };
        }

        var progress = gameState.screenShake.timer / gameState.screenShake.duration;
        var decay = 1 - progress; // Linear decay from 1 to 0
        var currentIntensity = gameState.screenShake.intensity * decay;

        return {
          x: (Math.random() * 2 - 1) * currentIntensity,
          y: (Math.random() * 2 - 1) * currentIntensity
        };
      }

      function updateVisualOverlays(dt) {
        if (gameState.shakeCooldown > 0) {
          gameState.shakeCooldown -= dt;
          if (gameState.shakeCooldown < 0) gameState.shakeCooldown = 0;
        }
        if (gameState.critFlashCooldown > 0) {
          gameState.critFlashCooldown -= dt;
          if (gameState.critFlashCooldown < 0) gameState.critFlashCooldown = 0;
        }
        if (gameState.critFlashTimer > 0) {
          gameState.critFlashTimer -= dt;
          if (gameState.critFlashTimer < 0) gameState.critFlashTimer = 0;
        }
        if (gameState.damageVignetteTimer > 0) {
          gameState.damageVignetteTimer -= dt;
          if (gameState.damageVignetteTimer < 0) gameState.damageVignetteTimer = 0;
        }
        if (gameState.levelUpFlashTimer > 0) {
          gameState.levelUpFlashTimer -= dt;
          if (gameState.levelUpFlashTimer < 0) gameState.levelUpFlashTimer = 0;
        }
      }

      function drawVisualOverlays() {
        // Crit flash: brief white overlay
        if (gameState.critFlashTimer > 0) {
          var critAlpha = (gameState.critFlashTimer / CRIT_FLASH_DURATION) * 0.15;
          ctx.fillStyle = 'rgba(255, 255, 255, ' + critAlpha + ')';
          ctx.fillRect(0, 0, VIEWPORT_W, VIEWPORT_H);
        }

        // Damage vignette: red edges
        if (gameState.damageVignetteTimer > 0) {
          var vigAlpha = (gameState.damageVignetteTimer / DAMAGE_VIGNETTE_DURATION) * 0.4;
          var vigGrad = ctx.createRadialGradient(
            VIEWPORT_W / 2, VIEWPORT_H / 2, VIEWPORT_W * 0.3,
            VIEWPORT_W / 2, VIEWPORT_H / 2, VIEWPORT_W * 0.7
          );
          vigGrad.addColorStop(0, 'rgba(255, 0, 0, 0)');
          vigGrad.addColorStop(1, 'rgba(255, 0, 0, ' + vigAlpha + ')');
          ctx.fillStyle = vigGrad;
          ctx.fillRect(0, 0, VIEWPORT_W, VIEWPORT_H);
        }

        // Level-up flash: gold overlay
        if (gameState.levelUpFlashTimer > 0) {
          var lvlAlpha = (gameState.levelUpFlashTimer / LEVELUP_FLASH_DURATION) * 0.2;
          ctx.fillStyle = 'rgba(232, 200, 73, ' + lvlAlpha + ')';
          ctx.fillRect(0, 0, VIEWPORT_W, VIEWPORT_H);
        }
      }

      function drawParticles() {
        for (var i = 0; i < gameState.particles.length; i++) {
          var p = gameState.particles[i];
          if (!p.alive) continue;

          var screen = worldToScreen(p.x, p.y);

          // Cull off-screen particles
          if (screen.x < -20 || screen.x > VIEWPORT_W + 20 ||
              screen.y < -20 || screen.y > VIEWPORT_H + 20) continue;

          var progress = 1 - (p.lifetime / p.maxLifetime); // 0 at start, 1 at end
          var alpha = p.fadeOut ? (1 - progress) : 1;
          var currentSize = p.shrink ? p.size * (1 - progress) : p.size;

          if (p.isAmbient) alpha *= 0.3; // Ambient particles are very faint

          if (currentSize <= 0 || alpha <= 0) continue;

          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(screen.x, screen.y, currentSize, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }

      function shuffleArray(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;
        }
      }

      var LEVEL_UP_ICON_LAYOUT = {

      function generateLevelUpCards() {
        var weaponPool = [];
        var statPool = [];

        // 1. New weapons (if player has fewer than MAX_WEAPONS weapons)
        if (gameState.weapons.length < MAX_WEAPONS) {
          var heldIds = {};
          for (var i = 0; i < gameState.weapons.length; i++) {
            heldIds[gameState.weapons[i].id] = true;
          }
          var weaponIds = Object.keys(WEAPON_DEFS);
          for (var i = 0; i < weaponIds.length; i++) {
            var wid = weaponIds[i];
            if (!heldIds[wid]) {
              var def = WEAPON_DEFS[wid];
              weaponPool.push({
                type: 'weapon_new',
                weaponId: wid,
                name: def.name,
                description: def.description,
                icon: def.icon,
                iconColor: def.color,
                level: 1,
                screenX: 0, screenY: 0, screenW: CARD_WIDTH, screenH: CARD_HEIGHT, hovered: false
              });
            }
          }
        }

        // 2. Weapon upgrades (for held weapons not at max level 5)
        for (var i = 0; i < gameState.weapons.length; i++) {
          var w = gameState.weapons[i];
          if (w.level < 5) {
            var def = WEAPON_DEFS[w.id];
            var nextLevel = w.level + 1;
            weaponPool.push({
              type: 'weapon_upgrade',
              weaponId: w.id,
              name: def.name,
              description: def.levels[nextLevel - 1].desc,
              icon: def.icon,
              iconColor: def.color,
              level: nextLevel,
              screenX: 0, screenY: 0, screenW: CARD_WIDTH, screenH: CARD_HEIGHT, hovered: false
            });
          }
        }

        // 3. Stat boosts (always available)
        var stats = [
          { statId: 'speed', name: 'Move Speed +10%', description: 'Increases movement speed by 10%', icon: '>>' },
          { statId: 'maxHp', name: 'Max HP +10%', description: 'Increases maximum HP by 10%', icon: '+' },
          { statId: 'damage', name: 'Damage +10%', description: 'Increases all damage by 10%', icon: '!!' },
          { statId: 'pickupRadius', name: 'Pickup Range +15%', description: 'Increases gem pickup range by 15%', icon: '()' },
          { statId: 'critChance', name: 'Crit Chance +5%', description: 'Increases critical hit chance by 5%', icon: '*' },
          { statId: 'cooldownReduction', name: 'Cooldown -8%', description: 'Reduces weapon cooldown by 8%', icon: '<<' },
          { statId: 'armor', name: 'Armor +1', description: 'Reduces damage taken by 1 per hit', icon: '[]' }
        ];
        for (var i = 0; i < stats.length; i++) {
          var s = stats[i];
          statPool.push({
            type: 'stat',
            statId: s.statId,
            name: s.name,
            description: s.description,
            icon: s.icon,
            screenX: 0, screenY: 0, screenW: CARD_WIDTH, screenH: CARD_HEIGHT, hovered: false
          });
        }

        // Shuffle both pools independently
        shuffleArray(weaponPool);
        shuffleArray(statPool);

        // Pick cards: prefer 2 weapon + 1 stat when possible
        var selected = [];
        var wCount = Math.min(2, weaponPool.length);
        for (var i = 0; i < wCount; i++) {
          selected.push(weaponPool[i]);
        }
        var remaining = LEVEL_UP_CARD_COUNT - selected.length;
        for (var i = 0; i < remaining && i < statPool.length; i++) {
          selected.push(statPool[i]);
        }
        // If still not enough (unlikely), fill from weapon pool
        if (selected.length < LEVEL_UP_CARD_COUNT) {
          for (var i = wCount; i < weaponPool.length && selected.length < LEVEL_UP_CARD_COUNT; i++) {
            selected.push(weaponPool[i]);
          }
        }

        // Shuffle the final 3 cards so weapon/stat positions vary
        shuffleArray(selected);

        gameState.levelUpCards = selected;
      }

      function selectLevelUpCard(cardIndex) {
        if (cardIndex < 0 || cardIndex >= gameState.levelUpCards.length) return;
        var card = gameState.levelUpCards[cardIndex];
        var player = gameState.player;

        if (card.type === 'weapon_new') {
          // Add new weapon at level 1
          gameState.weapons.push({
            id: card.weaponId,
            level: 1,
            cooldownTimer: 0
          });
          player.weaponCount = gameState.weapons.length;
          player.weapons = gameState.weapons.map(function(w) { return {id: w.id, level: w.level}; });

        } else if (card.type === 'weapon_upgrade') {
          // Find weapon and increment level
          for (var i = 0; i < gameState.weapons.length; i++) {
            if (gameState.weapons[i].id === card.weaponId) {
              gameState.weapons[i].level = card.level;
              break;
            }
          }
          player.weaponCount = gameState.weapons.length;
          player.weapons = gameState.weapons.map(function(w) { return {id: w.id, level: w.level}; });

        } else if (card.type === 'stat') {
          // Existing stat application logic (unchanged from Layer 2)
          switch (card.statId) {
            case 'speed':
              player.speed *= 1.10;
              break;
            case 'maxHp':
              var oldMax = player.maxHp;
              player.maxHp = Math.floor(player.maxHp * 1.10);
              player.hp += (player.maxHp - oldMax);
              break;
            case 'damage':
              player.damage *= 1.10;
              break;
            case 'pickupRadius':
              player.pickupRadius *= 1.15;
              break;
            case 'critChance':
              player.critChance = Math.min(0.75, player.critChance + 0.05);
              break;
            case 'cooldownReduction':
              player.cooldownReduction *= 0.92;
              break;
            case 'armor':
              player.armor += 1;
              break;
          }
        }

        window.playSound('weapon_select');
        gameState.levelUpCards = [];
        setState('PLAYING');

        // Update player instrumentation with all properties including weapons
        window.__GAME_STATE__.updateEntity('player', {
          x: player.x,
          y: player.y,
          hp: player.hp,
          maxHp: player.maxHp,
          speed: player.speed,
          invulnTimer: player.invulnTimer,
          facingX: player.facingX,
          facingY: player.facingY,
          xp: player.xp,
          level: player.level,
          xpToNext: player.xpToNext,
          pickupRadius: player.pickupRadius,
          damage: player.damage,
          critChance: player.critChance,
          cooldownReduction: player.cooldownReduction,
          armor: player.armor,
          weapons: gameState.weapons.map(function(w) { return {id: w.id, level: w.level}; }),
          weaponCount: gameState.weapons.length,
          gold: player.gold,
          characterId: player.characterId || gameState.selectedCharacter,
          xpGainMultiplier: player.xpGainMultiplier || 1.0
        });

        // Check for overflow level-up
        checkLevelUp();
      }

      function startFadeTransition(callback) {
        gameState.fadeTimer = FADE_DURATION;
        gameState.fadeDirection = 'out';
        gameState.fadeCallback = callback;
      }

      function updateFadeTransition(dt) {
        if (gameState.fadeDirection === 'none') return;

        gameState.fadeTimer -= dt;

        if (gameState.fadeTimer <= 0) {
          if (gameState.fadeDirection === 'out') {
            // Fade-out complete: execute callback and start fade-in
            if (gameState.fadeCallback) {
              gameState.fadeCallback();
              gameState.fadeCallback = null;
            }
            gameState.fadeTimer = FADE_DURATION;
            gameState.fadeDirection = 'in';
          } else if (gameState.fadeDirection === 'in') {
            // Fade-in complete
            gameState.fadeDirection = 'none';
            gameState.fadeTimer = 0;
          }
        }
      }

      function drawFadeOverlay() {
        if (gameState.fadeDirection === 'none') return;

        var alpha;
        if (gameState.fadeDirection === 'out') {
          // Fading to black: alpha goes from 0 to 1
          alpha = 1 - (gameState.fadeTimer / FADE_DURATION);
        } else {
          // Fading from black: alpha goes from 1 to 0
          alpha = gameState.fadeTimer / FADE_DURATION;
        }

        alpha = Math.max(0, Math.min(1, alpha));
        ctx.fillStyle = 'rgba(0, 0, 0, ' + alpha + ')';
        ctx.fillRect(-10, -10, VIEWPORT_W + 20, VIEWPORT_H + 20);

            1 + Math.random() * 2,

        ctx.font = _getUiValue('volumeLabelFont', '700 10px Trebuchet MS, sans-serif');

        ctx.fillStyle = _getUiValue('volumeKnobFill', '#d7f4ff');
        ctx.fill();

        ctx.stroke();

        ctx.fillStyle = _getUiValue('volumeLabelColor', '#abc8d8');

        drawOrnatePanel(musBarX - 8, musBarY - 6, sliderW + 16, sliderH + 12, {

        ctx.fillRect(musBarX, musBarY, sliderW, sliderH);
        ctx.fillStyle = _getUiValue('volumeTrackFill', '#86dbff');
        ctx.fillRect(musBarX, musBarY, sliderW * _musicVolume, sliderH);

        var musKnobX = musBarX + sliderW * _musicVolume;
        ctx.beginPath();
        ctx.arc(musKnobX, musBarY + sliderH / 2, knobR, 0, Math.PI * 2);
        ctx.fillStyle = _getUiValue('volumeKnobFill', '#d7f4ff');
        ctx.fill();
        ctx.strokeStyle = _getUiValue('volumeKnobStroke', '#77c9e8');
        ctx.stroke();

        // Store rects for click/drag detection
        gameState._volSliders = {
          sfx: { x: sfxBarX, y: sfxBarY - knobR, w: sliderW, h: sliderH + knobR * 2 },
          music: { x: musBarX, y: musBarY - knobR, w: sliderW, h: sliderH + knobR * 2 }

      var _draggingSlider = null; // 'sfx' | 'music' | null

      function handleVolumeClick(mx, my, isDown) {
        var sliders = gameState._volSliders;
        if (!sliders) return false;

        if (isDown) {
          // Check if click is on a slider
          if (mx >= sliders.sfx.x && mx <= sliders.sfx.x + sliders.sfx.w &&
              my >= sliders.sfx.y && my <= sliders.sfx.y + sliders.sfx.h) {
            _draggingSlider = 'sfx';
          } else if (mx >= sliders.music.x && mx <= sliders.music.x + sliders.music.w &&
                     my >= sliders.music.y && my <= sliders.music.y + sliders.music.h) {
            _draggingSlider = 'music';
          }
        }

        if (_draggingSlider) {
          var s = sliders[_draggingSlider];
          var val = Math.max(0, Math.min(1, (mx - s.x) / _VOL_SLIDER_W));
          // Exponential curve: slider position^2 for perceptual loudness
          var gain = val * val;
          if (_draggingSlider === 'sfx') {
            _sfxVolume = val;
            if (_sfxGain) _sfxGain.gain.value = gain;
          } else {
            _musicVolume = val;
            if (window._bgmGain) {
              window._bgmGain.gain.value = gain;
            } else if (window.BGM) {
              window.BGM.volume = gain;
            }
          }
          _saveVolume();
          return true;
        }
        return false;
      }

      // =====================================================================
      // RENDERER (renderer.js)
      // =====================================================================
      var canvas = null;
      var ctx = null;
      var canvasDeviceScale = 1;

      function initRenderer(canvasEl) {
        canvas = canvasEl;
        ctx = canvas.getContext('2d');
        ctx.setTransform(canvasDeviceScale, 0, 0, canvasDeviceScale, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
      }

      function render() {
        if (!ctx) return;

        // Layer 7: Screen shake offset (only during active gameplay)
        var shakeOff = { x: 0, y: 0 };
        if (gameState.state === 'PLAYING') {
          shakeOff = getShakeOffset();
        }
        ctx.save();
        ctx.translate(shakeOff.x, shakeOff.y);

        if (gameState.state === 'TITLE') {
          // Title screen rendering
          drawTitleScreen();
        } else if (gameState.state === 'SHOP') {
          // Layer 9: Shop screen rendering
          drawShopScreen();
        } else {
          // Clear (expanded by 10px to prevent edge artifacts from shake)
          ctx.fillStyle = '#1a2e1a';
          ctx.fillRect(-10, -10, VIEWPORT_W + 20, VIEWPORT_H + 20);

          // Draw tiled ground
          drawGround();

          // Layer 2: Draw XP gems (after ground, before enemies)
          drawXPGems();

          // Layer 5: Draw pickups (coins, hearts, magnets, chests)
          drawPickups();

          // Layer 3: Draw weapon effects (garlic aura, holy water, whip, runic, lightning)
          drawWeaponEffects();

          // Draw enemies
          drawEnemies();

          // Draw projectiles (knives + fireballs + axes)
          drawProjectiles();

          // Draw player
          drawPlayer();

          // Layer 2: Draw damage numbers (after player)
          drawDamageNumbers();

          // Layer 7: Draw particles (world-space particles after damage numbers, before HUD overlays)
          drawParticles();

          // Draw HUD
          drawHUD();

          // Layer 12: Weapon tooltip on HUD hover
          drawWeaponTooltip();

          // Layer 10: Combo counter
          drawComboCounter();

          // Layer 6: Boss health bar
          drawBossHealthBar();

          // Layer 4: Wave announcement flash at screen edges
          if (gameState.waveAnnouncementTimer > 0) {
            drawWaveAnnouncement();
          }

          // Layer 7: Visual overlays (crit flash, damage vignette, level-up flash)
          drawVisualOverlays();

          // Draw game over overlay if needed
          if (gameState.state === 'GAME_OVER') {
            drawGameOver();
          }

          // Layer 6: Victory screen
          if (gameState.state === 'VICTORY') {
            drawVictoryScreen();
          }

          // Layer 2: Level-up overlay
          if (gameState.state === 'LEVEL_UP') {
            drawLevelUpOverlay();
          }

          // Layer 8: Pause menu overlay
          if (gameState.state === 'PAUSED') {
            drawPauseMenu();
          }
        }

        // Layer 8: Fade transition overlay (always on top of everything)
        drawFadeOverlay();

      // Helper: simple word-wrap for card descriptions
      function wrapText(context, text, x, y, maxWidth, lineHeight) {
        var words = text.split(' ');
        var line = '';
        for (var n = 0; n < words.length; n++) {
          var testLine = line + words[n] + ' ';
          var metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            context.fillText(line.trim(), x, y);
            line = words[n] + ' ';
            y += lineHeight;
          } else {
            line = testLine;

        }
        context.fillText(line.trim(), x, y);
      }

      // Layer 12: Entity count helper
      function getTotalEntityCount() {
        return gameState.enemies.length +
               gameState.projectiles.length +
               gameState.xpGems.length +
               gameState.pickups.length +
               gameState.particles.length;
      }

      // Layer 12: Enforce entity cap
      function enforceEntityCap() {
        var total = getTotalEntityCount();
        if (total <= HARD_ENTITY_CAP) return;

        // Phase 1: Cull excess particles first (lowest priority entities)
        var excess = total - HARD_ENTITY_CAP;
        var particlesToCull = Math.min(excess, gameState.particles.length - 50);
        if (particlesToCull > 0) {
          gameState.particles.sort(function(a, b) { return a.lifetime - b.lifetime; });
          gameState.particles.splice(0, particlesToCull);
          total -= particlesToCull;
        }

        // Phase 2: If still over cap, cull farthest XP gems
        if (total > HARD_ENTITY_CAP) {
          excess = total - HARD_ENTITY_CAP;
          var gemsToRemove = Math.min(excess, Math.floor(gameState.xpGems.length * 0.3));
          if (gemsToRemove > 0 && gameState.player) {
            gameState.xpGems.sort(function(a, b) {
              var da = Math.hypot(a.x - gameState.player.x, a.y - gameState.player.y);
              var db = Math.hypot(b.x - gameState.player.x, b.y - gameState.player.y);
              return db - da;
            });
            gameState.xpGems.splice(0, gemsToRemove);
          }
        }
      }

      // Layer 12: FPS monitoring
      function updateFpsMonitor(dt) {
        if (dt <= 0) return;

        gameState.fpsSamples.push(dt);
        if (gameState.fpsSamples.length > FPS_SAMPLE_SIZE) {
          gameState.fpsSamples.shift();
        }

        if (gameState.fpsSamples.length >= 10) {
          var totalDt = 0;
          for (var i = 0; i < gameState.fpsSamples.length; i++) {
            totalDt += gameState.fpsSamples[i];
          }
          var avgDt = totalDt / gameState.fpsSamples.length;
          gameState.currentFps = Math.round(1 / avgDt);
        }

        if (!gameState.performanceDegraded && gameState.currentFps < FPS_LOW_THRESHOLD) {
          gameState.performanceDegraded = true;
        } else if (gameState.performanceDegraded && gameState.currentFps > FPS_RECOVERY_THRESHOLD) {
          gameState.performanceDegraded = false;
        }
      }

      // Layer 12: Keyboard menu navigation helper
      function updateMenuNavigation(dt) {
        if (gameState.menuNavTimer > 0) {
          gameState.menuNavTimer -= dt;
        }

        var canNav = gameState.menuNavTimer <= 0;

        // TITLE SCREEN: Arrow keys cycle character selection
        if (gameState.state === 'TITLE' && canNav) {
          var availableIds = getAvailableCharacterIds();
          var currentIdx = availableIds.indexOf(gameState.selectedCharacter);
          if (currentIdx < 0) currentIdx = 0;

          if (isKeyDown('ArrowLeft') || isKeyDown('KeyA')) {
            currentIdx = (currentIdx - 1 + availableIds.length) % availableIds.length;
            gameState.selectedCharacter = availableIds[currentIdx];
            gameState.menuNavTimer = MENU_NAV_REPEAT_DELAY;
          } else if (isKeyDown('ArrowRight') || isKeyDown('KeyD')) {
            currentIdx = (currentIdx + 1) % availableIds.length;
            gameState.selectedCharacter = availableIds[currentIdx];
            gameState.menuNavTimer = MENU_NAV_REPEAT_DELAY;
          }
        }

        // PAUSE MENU: Arrow keys navigate, Enter/Space selects
        if (gameState.state === 'PAUSED') {
          var pauseButtonCount = 3;

          if (canNav && (isKeyDown('ArrowUp') || isKeyDown('KeyW'))) {
            gameState.menuSelectedIndex = (gameState.menuSelectedIndex - 1 + pauseButtonCount) % pauseButtonCount;
            gameState.menuNavTimer = MENU_NAV_REPEAT_DELAY;
          } else if (canNav && (isKeyDown('ArrowDown') || isKeyDown('KeyS'))) {
            gameState.menuSelectedIndex = (gameState.menuSelectedIndex + 1) % pauseButtonCount;
            gameState.menuNavTimer = MENU_NAV_REPEAT_DELAY;
          }

          if (consumeKey('Enter') || consumeKey('Space')) {
            var selectedId = ['resume', 'restart', 'quit'][gameState.menuSelectedIndex];
            if (selectedId === 'resume') {
              togglePause();
            } else if (selectedId === 'restart') {
              startFadeTransition(function() {
                startNewGame();
              });
            } else if (selectedId === 'quit') {
              startFadeTransition(function() {
                goToTitle();
              });
            }
          }
        }

        // PLAYING: ArrowDown in PLAYING state should NOT be consumed here (regression guard)
        // ArrowDown is a movement key in PLAYING state, handled by updatePlayer
      }
