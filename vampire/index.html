<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightfall Survivors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel:wght@600;700&family=Barlow+Condensed:wght@400;600;700&family=Manrope:wght@400;600;700;800&family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); image-rendering: auto; }
  </style>

<style>
    #rosebud-exported-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        opacity: 1;
        transition: opacity 500ms ease-in-out;
    }

    #rosebud-exported-splash.is-hiding {
        opacity: 0;
    }

    #rosebud-exported-splash .rosebud-exported-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #rosebud-exported-splash .rosebud-exported-splash__logo {
        width: 100px;
        height: 100px;
        animation: rosebud-exported-splash-breathe 2.4s ease-in-out infinite;
    }

    #rosebud-exported-splash .rosebud-exported-splash__text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 16px;
        line-height: 1.25;
        letter-spacing: 0.06em;
    }

    #rosebud-exported-splash .rosebud-exported-splash__text strong {
        font-weight: 700;
    }

    #rosebud-exported-splash .rosebud-exported-splash__text span:last-child {
        opacity: 0.88;
    }

    @keyframes rosebud-exported-splash-breathe {
        0%,
        100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.05);
        }
    }
</style></head>
<body>
<div id="rosebud-exported-splash" aria-live="polite">
    <div class="rosebud-exported-splash__content">
        <img
            class="rosebud-exported-splash__logo"
            src="__rosebud/rosebud-icon.png"
            alt="Rosebud Logo"
            width="100"
            height="100"
        />
        <div class="rosebud-exported-splash__text" aria-label="Rosebud.AI Make Games">
            <strong>Rosebud.AI</strong>
            <span>Make Games</span>
        </div>
    </div>
</div>
  <canvas id="gameCanvas"></canvas>
  <script src="manifest.js"></script>
  <script src="theme.js"></script>

  <!-- __GAME_STATE__ instrumentation - MUST run before game code -->
  <script>
    (function() {
      const state = { entities: {}, frameCount: 0, running: false, errors: [] };
      window.__GAME_STATE__ = {
        getState() { return JSON.parse(JSON.stringify(state)); },
        loadState(newState) {
          if (newState.entities) state.entities = JSON.parse(JSON.stringify(newState.entities));
          if (typeof newState.frameCount === 'number') state.frameCount = newState.frameCount;
          if (typeof newState.running === 'boolean') state.running = newState.running;
          if (newState.errors) state.errors = JSON.parse(JSON.stringify(newState.errors));
          if (typeof window.__GAME_STATE__.onLoadState === 'function') {
            window.__GAME_STATE__.onLoadState(JSON.parse(JSON.stringify(state)));
          }
        },
        registerEntity(id, initial) { state.entities[id] = Object.assign({}, initial); },
        updateEntity(id, next) { state.entities[id] = Object.assign({}, next); },
        start() { state.running = true; },
        stop() { state.running = false; },
        tick() { state.frameCount++; },
        recordError(msg) { state.errors.push(msg); },
        serialize() { return JSON.stringify(state); }
      };
    })();
  </script>

  <!-- ================================================================== -->
  <!-- SOUND SYSTEM  (bus architecture + compressor + adaptive ducking)  -->
  <!-- ================================================================== -->
  <script>
  window.__SOUND_LOG__ = [];

  // ── Volume state (preserved for UI/localStorage compatibility) ──────
  var _sfxVolume   = 0.5;  // 0–1 slider position (gain = val^2)
  var _musicVolume = 0.5;  // 0–1 slider position (gain = val^2)
  try {
    var _savedVol = JSON.parse(localStorage.getItem('nightfall_survivors_volume') || '{}');
    if (typeof _savedVol.sfx   === 'number') _sfxVolume   = _savedVol.sfx;
    if (typeof _savedVol.music === 'number') _musicVolume = _savedVol.music;
  } catch(e) {}
  function _saveVolume() {
    try { localStorage.setItem('nightfall_survivors_volume', JSON.stringify({ sfx: _sfxVolume, music: _musicVolume })); } catch(e) {}
  }

  // ── Audio context (exposed as window._audioCtx for evaluator) ───────
  var _audioCtx = null;

  // ── Bus nodes (created on first _ensureAudio() call) ────────────────
  // Signal chain:
  //   BufferSource → bus gain → _sfxGain (master SFX) → compressor → destination
  //   BGM <audio>  → MediaElementSource → _bgmDuckGain → _bgmGain → compressor → destination
  var _sfxGain        = null;  // master SFX gain  (referenced by volume slider UI)
  var _busWeapons     = null;  // weapons / projectile sounds
  var _busEnemies     = null;  // enemy reactions (hit, die, boss)
  var _busPickups     = null;  // xp, gold, heart, magnet, chest
  var _busUI          = null;  // menu, level-up, pause, game-start
  var _compressor     = null;  // DynamicsCompressorNode on master output
  var _bgmGain        = null;  // BGM volume gain (Web Audio path; null if unavailable)
  var _bgmSrc         = null;  // MediaElementSourceNode wrapping BGM <audio>
  var _bgmDuckGain    = null;  // additional gain node for adaptive ducking
  var _bgmDuckTarget  = 1.0;   // target multiplier (1 = normal, lower = ducked)
  var _bgmDuckTimer   = 0;     // ms remaining at current duck level

  function _ensureAudio() {
    if (!_audioCtx) {
      _audioCtx = new AudioContext();

      // ── Master compressor ────────────────────────────────────────
      _compressor = _audioCtx.createDynamicsCompressor();
      _compressor.threshold.value = -6;   // dB — only catch loud peaks
      _compressor.knee.value       = 12;
      _compressor.ratio.value      =  3;
      _compressor.attack.value     =  0.003;
      _compressor.release.value    =  0.25;
      _compressor.connect(_audioCtx.destination);

      // ── SFX master bus ───────────────────────────────────────────
      _sfxGain = _audioCtx.createGain();
      _sfxGain.gain.value = _sfxVolume * _sfxVolume; // exponential curve
      _sfxGain.connect(_compressor);

      // ── Category buses (attenuated to prevent stacking overload) ──
      _busWeapons = _audioCtx.createGain(); _busWeapons.gain.value = 0.5;
      _busWeapons.connect(_sfxGain);

      _busEnemies = _audioCtx.createGain(); _busEnemies.gain.value = 0.4;
      _busEnemies.connect(_sfxGain);

      _busPickups = _audioCtx.createGain(); _busPickups.gain.value = 0.5;
      _busPickups.connect(_sfxGain);

      _busUI = _audioCtx.createGain(); _busUI.gain.value = 0.7;
      _busUI.connect(_sfxGain);

      // ── BGM Web Audio path (for compressor + ducking) ────────────
      // Wire the existing <audio> element through Web Audio.
      // Wrapped in try/catch: if MediaElementSourceNode is unavailable
      // (e.g. file:// protocol), BGM falls back to direct .volume control.
      try {
        if (window.BGM) {
          _bgmDuckGain = _audioCtx.createGain();
          _bgmDuckGain.gain.value = 1.0;

          _bgmGain = _audioCtx.createGain();
          _bgmGain.gain.value = _musicVolume * _musicVolume; // exponential curve
          window._bgmGain = _bgmGain;

          _bgmSrc = _audioCtx.createMediaElementSource(window.BGM);
          _bgmSrc.connect(_bgmDuckGain);
          _bgmDuckGain.connect(_bgmGain);
          _bgmGain.connect(_compressor);

          // After routing through Web Audio, set the HTML element's
          // volume to 1.0 so the gain node is the sole volume control.
          window.BGM.volume = 1.0;
        }
      } catch(e) {
        // Fallback: BGM remains on direct HTML audio path
        _bgmGain     = null;
        _bgmDuckGain = null;
      }
    }
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    window._audioCtx = _audioCtx;
    return _audioCtx;
  }
  document.addEventListener('keydown', _ensureAudio, { once: true });
  document.addEventListener('click',   _ensureAudio, { once: true });

  // ── Adaptive BGM ducking ─────────────────────────────────────────────
  // Sounds that trigger BGM ducking: [duckMultiplier, holdMs]
  var _DUCK_MAP = {
    boss_roar:    [0.25, 3000],
    boss_die:     [0.25, 4000],
    level_up:     [0.35, 1500],
    game_start:   [0.40, 2000],
    player_die:   [0.20, 3000],
    wave_warning: [0.45, 2500]
  };
  var _DUCK_RELEASE_TC = 0.8; // seconds time-constant for release ramp

  function _triggerDuck(name) {
    var entry = _DUCK_MAP[name];
    if (!entry) return;
    var level = entry[0];
    var dur   = entry[1];
    // Only duck deeper, never shallower while already ducked
    if (_bgmDuckTarget > level) {
      _bgmDuckTarget = level;
      if (_bgmDuckGain && _audioCtx) {
        _bgmDuckGain.gain.cancelScheduledValues(_audioCtx.currentTime);
        _bgmDuckGain.gain.setTargetAtTime(level, _audioCtx.currentTime, 0.05);
      }
    }
    if (dur > _bgmDuckTimer) _bgmDuckTimer = dur;
  }

  // Duck timer advanced via rAF so it works without touching game code
  var _lastDuckTs = 0;
  (function _duckLoop(ts) {
    if (_bgmDuckTimer > 0 && _lastDuckTs > 0) {
      var dt = ts - _lastDuckTs;
      if (dt > 0 && dt < 200) {
        _bgmDuckTimer -= dt;
        if (_bgmDuckTimer <= 0) {
          _bgmDuckTimer  = 0;
          _bgmDuckTarget = 1.0;
          if (_bgmDuckGain && _audioCtx) {
            _bgmDuckGain.gain.cancelScheduledValues(_audioCtx.currentTime);
            _bgmDuckGain.gain.setTargetAtTime(1.0, _audioCtx.currentTime, _DUCK_RELEASE_TC);
          }
        }
      }
    }
    _lastDuckTs = ts;
    requestAnimationFrame(_duckLoop);
  })(0);

  // ── AudioBuffer SFX (zero latency, overlapping) ──────────────────────
  var _sfxBuffers = {};
  var _canFetch = (window.location.protocol === 'http:' || window.location.protocol === 'https:');

  // Per-sound definition: { bus, maxConc, cooldownMs, priority }
  // priority 5 = critical (boss/player die), 1 = low (ambient/high-freq spam)
  var _SFX_DEF = {
    knife_throw:       { bus: 'weapons', maxConc: 3, cooldownMs:  50, priority: 2 },
    garlic_pulse:      { bus: 'weapons', maxConc: 1, cooldownMs: 100, priority: 1 },
    holy_water_splash: { bus: 'weapons', maxConc: 2, cooldownMs: 100, priority: 2 },
    fireball_launch:   { bus: 'weapons', maxConc: 2, cooldownMs:  80, priority: 2 },
    lightning_strike:  { bus: 'weapons', maxConc: 2, cooldownMs:  80, priority: 2 },
    axe_throw:         { bus: 'weapons', maxConc: 2, cooldownMs:  80, priority: 2 },
    whip_crack:        { bus: 'weapons', maxConc: 2, cooldownMs:  60, priority: 2 },
    runic_blast:       { bus: 'weapons', maxConc: 2, cooldownMs:  80, priority: 2 },
    enemy_hit:         { bus: 'enemies', maxConc: 2, cooldownMs:  60, priority: 1 },
    enemy_die:         { bus: 'enemies', maxConc: 3, cooldownMs:  40, priority: 2 },
    slime_split:       { bus: 'enemies', maxConc: 2, cooldownMs: 100, priority: 2 },
    boss_roar:         { bus: 'enemies', maxConc: 1, cooldownMs: 500, priority: 5 },
    boss_die:          { bus: 'enemies', maxConc: 1, cooldownMs: 500, priority: 5 },
    player_hit:        { bus: 'enemies', maxConc: 2, cooldownMs: 120, priority: 4 },
    player_die:        { bus: 'enemies', maxConc: 1, cooldownMs: 500, priority: 5 },
    xp_pickup:         { bus: 'pickups', maxConc: 2, cooldownMs:  80, priority: 1 },
    gold_pickup:       { bus: 'pickups', maxConc: 2, cooldownMs:  80, priority: 1 },
    heart_pickup:      { bus: 'pickups', maxConc: 1, cooldownMs: 200, priority: 3 },
    magnet_pickup:     { bus: 'pickups', maxConc: 1, cooldownMs: 200, priority: 3 },
    chest_open:        { bus: 'pickups', maxConc: 1, cooldownMs: 300, priority: 3 },
    level_up:          { bus: 'ui',      maxConc: 1, cooldownMs: 300, priority: 5 },
    weapon_select:     { bus: 'ui',      maxConc: 1, cooldownMs: 150, priority: 4 },
    menu_hover:        { bus: 'ui',      maxConc: 1, cooldownMs:  80, priority: 1 },
    menu_select:       { bus: 'ui',      maxConc: 1, cooldownMs: 100, priority: 3 },
    game_start:        { bus: 'ui',      maxConc: 1, cooldownMs: 500, priority: 5 },
    pause:             { bus: 'ui',      maxConc: 1, cooldownMs: 200, priority: 4 },
    unpause:           { bus: 'ui',      maxConc: 1, cooldownMs: 200, priority: 4 },
    wave_warning:      { bus: 'ui',      maxConc: 1, cooldownMs: 400, priority: 4 }
  };

  // Voice tracking
  var _sfxActive   = {};  // name → active voice count
  var _sfxLastPlay = {};  // name → performance.now() of last play

  // Global voice pool (priority-eviction when full)
  var _GLOBAL_MAX   = 24;
  var _activeVoices = []; // [{name, priority, node}]

  function _evictLowestPriority(minPriority) {
    var lowestIdx = -1;
    var lowestPri = minPriority; // only evict strictly lower-priority voices
    for (var i = 0; i < _activeVoices.length; i++) {
      if (_activeVoices[i].priority < lowestPri) {
        lowestPri = _activeVoices[i].priority;
        lowestIdx = i;
      }
    }
    if (lowestIdx < 0) return false;
    var victim = _activeVoices[lowestIdx];
    try { victim.node.stop(); } catch(e) {}
    // onended will remove from _activeVoices and decrement _sfxActive
    return true;
  }

  // Coalescing: collapse identical sounds fired within a short window
  var _COALESCE_MS = {
    enemy_hit:   20,
    enemy_die:   15,
    xp_pickup:   30,
    gold_pickup: 30
  };
  var _coalesceLastFire = {};

  function _getBusNode(busName) {
    if (busName === 'weapons') return _busWeapons;
    if (busName === 'enemies') return _busEnemies;
    if (busName === 'pickups') return _busPickups;
    if (busName === 'ui')      return _busUI;
    return _sfxGain;
  }

  var _audioManifest = null;

  function _loadAudioManifest() {
    var exportManifest = window.NightfallExportManifest || {};
    _audioManifest = exportManifest.audio || { sfx: [] };
    return Promise.resolve(_audioManifest);
  }

  function _loadSfx(name) {
    if (!_canFetch) return;
    
    // Wait for manifest to load, then fetch the sound
    _loadAudioManifest().then(function() {
      var url = 'sfx/' + name + '.mp3'; // default fallback
      
      // Find the sound in the manifest
      if (_audioManifest && _audioManifest.sfx) {
        for (var i = 0; i < _audioManifest.sfx.length; i++) {
          if (_audioManifest.sfx[i].name === name) {
            url = _audioManifest.sfx[i].file;
            break;
          }
        }
      }
      
      fetch(url)
        .then(function(r) { return r.arrayBuffer(); })
        .then(function(buf) { return _ensureAudio().decodeAudioData(buf); })
        .then(function(decoded) { _sfxBuffers[name] = decoded; })
        .catch(function() {});
    });
  }

  function _playSfx(name) {
    var buf = _sfxBuffers[name];
    if (!buf) return;

    var def = _SFX_DEF[name] || { bus: 'ui', maxConc: 3, cooldownMs: 30, priority: 2 };
    var now = performance.now();

    // Coalescing: skip if identical sound fired within coalesce window
    var cMs = _COALESCE_MS[name];
    if (cMs && (now - (_coalesceLastFire[name] || 0)) < cMs) return;

    // Per-sound cooldown
    if ((now - (_sfxLastPlay[name] || 0)) < def.cooldownMs) return;

    // Per-sound concurrency cap
    if ((_sfxActive[name] || 0) >= def.maxConc) return;

    // Global voice cap with priority eviction
    if (_activeVoices.length >= _GLOBAL_MAX) {
      if (!_evictLowestPriority(def.priority)) return;
    }

    _sfxLastPlay[name]      = now;
    _coalesceLastFire[name] = now;

    var ctx = _ensureAudio();
    var bus = _getBusNode(def.bus) || _sfxGain;
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var voiceGain = ctx.createGain();
    voiceGain.gain.value = 0.4 + Math.random() * 0.2; // 0.4–0.6 per voice
    src.connect(voiceGain);
    voiceGain.connect(bus);

    _sfxActive[name] = (_sfxActive[name] || 0) + 1;

    var voice = { name: name, priority: def.priority, node: src };
    _activeVoices.push(voice);

    src.onended = function() {
      _sfxActive[name] = Math.max(0, (_sfxActive[name] || 0) - 1);
      var idx = _activeVoices.indexOf(voice);
      if (idx >= 0) _activeVoices.splice(idx, 1);
    };
    src.start(0);
  }

  // Load all SFX from audio-manifest
  [
    'knife_throw', 'garlic_pulse', 'holy_water_splash', 'fireball_launch',
    'lightning_strike', 'axe_throw', 'whip_crack', 'runic_blast',
    'enemy_hit', 'enemy_die', 'slime_split',
    'boss_roar', 'boss_die',
    'player_hit', 'player_die',
    'xp_pickup', 'gold_pickup', 'heart_pickup', 'magnet_pickup',
    'chest_open', 'level_up', 'weapon_select',
    'menu_hover', 'menu_select', 'game_start',
    'pause', 'unpause', 'wave_warning'
  ].forEach(_loadSfx);

  // ── Sound definitions ────────────────────────────────────────────────
  window.SOUNDS = {
    knife_throw:       function() { _playSfx('knife_throw'); },
    garlic_pulse:      function() { _playSfx('garlic_pulse'); },
    holy_water_splash: function() { _playSfx('holy_water_splash'); },
    fireball_launch:   function() { _playSfx('fireball_launch'); },
    lightning_strike:  function() { _playSfx('lightning_strike'); },
    axe_throw:         function() { _playSfx('axe_throw'); },
    whip_crack:        function() { _playSfx('whip_crack'); },
    runic_blast:       function() { _playSfx('runic_blast'); },
    enemy_hit:         function() { _playSfx('enemy_hit'); },
    enemy_die:         function() { _playSfx('enemy_die'); },
    slime_split:       function() { _playSfx('slime_split'); },
    boss_roar:         function() { _playSfx('boss_roar'); },
    boss_die:          function() { _playSfx('boss_die'); },
    player_hit:        function() { _playSfx('player_hit'); },
    player_die:        function() { _playSfx('player_die'); },
    xp_pickup:         function() { _playSfx('xp_pickup'); },
    gold_pickup:       function() { _playSfx('gold_pickup'); },
    heart_pickup:      function() { _playSfx('heart_pickup'); },
    magnet_pickup:     function() { _playSfx('magnet_pickup'); },
    chest_open:        function() { _playSfx('chest_open'); },
    level_up:          function() { _playSfx('level_up'); },
    weapon_select:     function() { _playSfx('weapon_select'); },
    menu_hover:        function() { _playSfx('menu_hover'); },
    menu_select:       function() { _playSfx('menu_select'); },
    game_start:        function() { _playSfx('game_start'); },
    pause:             function() { _playSfx('pause'); },
    unpause:           function() { _playSfx('unpause'); },
    wave_warning:      function() { _playSfx('wave_warning'); }
  };

  // ── playSound wrapper (CRITICAL — do not modify) ─────────────────────
  window.playSound = function(name) {
    window.__SOUND_LOG__.push({
      name: name,
      frame: window.__GAME_STATE__ ? (window.__GAME_STATE__.getState().frameCount || 0) : 0
    });
    try {
      _ensureAudio();
      _triggerDuck(name);
      if (window.SOUNDS[name]) window.SOUNDS[name]();
    } catch (e) {}
  };
  </script>

  <!-- ── Background music ──────────────────────────────────────────── -->
  <script>
  // BGM element must exist BEFORE _ensureAudio() wires it into Web Audio.
  // It is declared here so window.BGM is set when _ensureAudio runs.
  var bgm = new Audio();
  bgm.crossOrigin = 'anonymous'; // Enable CORS for Web Audio API
  bgm.loop = false;
  bgm.volume = _musicVolume * _musicVolume;
  bgm.onerror = function() {}; // Silently ignore load failures
  var _themeMusic = {
    title: null,
    gameplayPlaylist: [],
    victory: null,
    defeat: null
  };
  var _bgmCurrentMode = null;
  var _bgmCurrentSrc = null;
  var _bgmStarted = false;
  var _bgmPlaylistIndex = 0;
  var _bgmLastGameplayIndex = -1;
  var _bgmGameplayBag = [];

  function _fileFromMusicEntry(entry) {
    if (!entry) return null;
    return typeof entry === 'string' ? entry : entry.file;
  }

  function _configureThemeMusic(manifest) {
    var fallback = manifest && manifest.music && manifest.music.file ? manifest.music.file : 'bgm.mp3';
    var themeMusic = manifest && manifest.themeMusic ? manifest.themeMusic : null;
    _themeMusic = {
      title: themeMusic && themeMusic.title ? themeMusic.title : fallback,
      gameplayPlaylist: themeMusic && themeMusic.gameplayPlaylist && themeMusic.gameplayPlaylist.length
        ? themeMusic.gameplayPlaylist.slice()
        : [fallback],
      victory: themeMusic && themeMusic.victory ? themeMusic.victory : fallback,
      defeat: themeMusic && themeMusic.defeat ? themeMusic.defeat : fallback
    };
  }

  function _setBgmTrack(src, loop) {
    if (!src) return;
    if (_bgmCurrentSrc === src && bgm.loop === loop) return;
    var wasPlaying = _bgmStarted;
    try { bgm.pause(); } catch (e) {}
    bgm.loop = loop;
    bgm.src = src;
    try { bgm.load(); } catch (e) {}
    _bgmCurrentSrc = src;
    if (wasPlaying) {
      var resume = function() {
        bgm.removeEventListener('canplay', resume);
        try { bgm.currentTime = 0; } catch (e) {}
        try { bgm.play(); } catch (e) {}
      };
      bgm.addEventListener('canplay', resume, { once: true });
    }
  }

  function _playGameplayPlaylistTrack(index) {
    if (!_themeMusic.gameplayPlaylist.length) return;
    _bgmPlaylistIndex = index % _themeMusic.gameplayPlaylist.length;
    _bgmLastGameplayIndex = _bgmPlaylistIndex;
    var src = _fileFromMusicEntry(_themeMusic.gameplayPlaylist[_bgmPlaylistIndex]);
    _setBgmTrack(src || 'bgm.mp3', false);
  }

  function _refillGameplayBag() {
    var count = _themeMusic.gameplayPlaylist.length;
    _bgmGameplayBag = [];
    for (var i = 0; i < count; i++) _bgmGameplayBag.push(i);
    for (var j = _bgmGameplayBag.length - 1; j > 0; j--) {

      // =====================================================================
      function initPlayer() {
        // Player init is handled by initState()
        return gameState.player;
      }

      function updatePlayer(dt) {
        var player = gameState.player;
        if (!player) return;

        // Read input: compute direction vector
        var dx = 0;
        var dy = 0;

        if (isKeyDown('KeyW') || isKeyDown('ArrowUp')) dy -= 1;
        if (isKeyDown('KeyS') || isKeyDown('ArrowDown')) dy += 1;
        if (isKeyDown('KeyA') || isKeyDown('ArrowLeft')) dx -= 1;
        if (isKeyDown('KeyD') || isKeyDown('ArrowRight')) dx += 1;

        // Normalize diagonal movement
        if (dx !== 0 && dy !== 0) {
          var invSqrt2 = 1 / Math.SQRT2;
          dx *= invSqrt2;
          dy *= invSqrt2;
        }

        // Update facing direction if moving
        if (dx !== 0 || dy !== 0) {
          player.facingX = Math.sign(dx);
          player.facingY = Math.sign(dy);
        }

        // Apply movement
        player.x += dx * player.speed * dt;
        player.y += dy * player.speed * dt;

        // Clamp to world bounds
        player.x = Math.max(WORLD_MIN, Math.min(WORLD_MAX, player.x));
        player.y = Math.max(WORLD_MIN, Math.min(WORLD_MAX, player.y));

        // Tick invulnerability timer
        if (player.invulnTimer > 0) {
          player.invulnTimer -= dt;
          if (player.invulnTimer < 0) player.invulnTimer = 0;
        }

        // Store whether the player is moving for render bobbing
        player._moving = (dx !== 0 || dy !== 0);

        // Update instrumentation
        window.__GAME_STATE__.updateEntity('player', {
          x: player.x,
          y: player.y,
          hp: player.hp,
          maxHp: player.maxHp,
          speed: player.speed,
          invulnTimer: player.invulnTimer,
          facingX: player.facingX,
          facingY: player.facingY,
          xp: player.xp,
          level: player.level,
          xpToNext: player.xpToNext,
          pickupRadius: player.pickupRadius,
          damage: player.damage,
          critChance: player.critChance,
          cooldownReduction: player.cooldownReduction,
          armor: player.armor,
          weapons: gameState.weapons.map(function(w) { return {id: w.id, level: w.level}; }),
          weaponCount: gameState.weapons.length,
          gold: player.gold,
          characterId: player.characterId || gameState.selectedCharacter,
          xpGainMultiplier: player.xpGainMultiplier || 1.0
        });
      }

      function damagePlayer(amount) {
        var player = gameState.player;
        if (!player) return;

        // No damage during invulnerability
        if (player.invulnTimer > 0) return;

        // Layer 2: armor reduces incoming damage (minimum 1)
        var actualDamage = Math.max(1, amount - player.armor);
        player.hp -= actualDamage;
        player.invulnTimer = 0.5;

        // Layer 7: Damage visual effects
        spawnParticleBurst(player.x, player.y, PARTICLE_PLAYER_DAMAGE_COUNT, '#ff4444', 40, 100, 2, 3, 0.3, { gravity: 50 });
        gameState.damageVignetteTimer = DAMAGE_VIGNETTE_DURATION;
        triggerScreenShake(SHAKE_LIGHT_INTENSITY, SHAKE_LIGHT_DURATION);

        if (player.hp <= 0) {
          player.hp = 0;
          window.playSound('player_die');
          if (window.BGM) { window.BGM.pause(); window.BGM.currentTime = 0; }
          setState('GAME_OVER');
        } else {
          window.playSound('player_hit');
        }

        // Layer 7: Near-death escalated shake
        if (player.hp > 0 && player.hp <= player.maxHp * 0.25) {
          triggerScreenShake(SHAKE_HEAVY_INTENSITY, SHAKE_HEAVY_DURATION);
        }

        // Update instrumentation
        window.__GAME_STATE__.updateEntity('player', {
          x: player.x,
          y: player.y,
          hp: player.hp,
          maxHp: player.maxHp,
          speed: player.speed,
          invulnTimer: player.invulnTimer,
          facingX: player.facingX,
          facingY: player.facingY,
          xp: player.xp,
          level: player.level,
          xpToNext: player.xpToNext,
          pickupRadius: player.pickupRadius,
          damage: player.damage,
          critChance: player.critChance,
          cooldownReduction: player.cooldownReduction,
          armor: player.armor,
          weapons: gameState.weapons.map(function(w) { return {id: w.id, level: w.level}; }),
          weaponCount: gameState.weapons.length,
          gold: gameState.player.gold,
          characterId: player.characterId || gameState.selectedCharacter,
          xpGainMultiplier: player.xpGainMultiplier || 1.0
        });
      }

      function isPlayerInvulnerable() {
        return gameState.player && gameState.player.invulnTimer > 0;
      }

      // =====================================================================
      // ENEMIES (enemies.js)
      // =====================================================================
      var spawnTimer = 0;

      function initEnemies() {
        gameState.enemies = [];
        spawnTimer = 0;
      }

      // Layer 4+11: Piecewise spawn rate matching design phases
      function getCurrentSpawnRate() {
        var elapsed = gameState.elapsed;
        // Layer 11: Piecewise spawn rate
        // 0:00-2:00  = 2.5-3 enemies/sec (learning phase)
        // 2:00-5:00  = 3-6 enemies/sec (building)
        // 5:00-10:00 = 6-10 enemies/sec (intense)
        // 10:00-20:00 = 10-15 enemies/sec (chaotic)
        // 20:00-25:00 = 15-18 enemies/sec (overwhelming)
        if (elapsed < 120) {
          // 0-2 min: 2.5 to 3
          return 2.5 + 0.5 * (elapsed / 120);
        } else if (elapsed < 300) {
          // 2-5 min: 3 to 6
          return 3 + 3 * ((elapsed - 120) / 180);
        } else if (elapsed < 600) {
          // 5-10 min: 6 to 10
          return 6 + 4 * ((elapsed - 300) / 300);
        } else if (elapsed < 1200) {
          // 10-20 min: 10 to 15
          return 10 + 5 * ((elapsed - 600) / 600);
        } else if (elapsed < 1500) {
          // 20-25 min: 15 to 18
          return 15 + 3 * ((elapsed - 1200) / 300);
        } else {
          return 18;
        }
      }

      // Layer 4: Enemy stat scaling with elapsed time
      function getScaledEnemyStats(enemyDef) {
        var minutes = gameState.elapsed / 60;
        var hpScale = 1 + ENEMY_HP_SCALE_PER_MIN * minutes;
        var speedScale = 1 + ENEMY_SPEED_SCALE_PER_MIN * minutes;
        return {
          hp: Math.floor(enemyDef.baseHp * hpScale),
          speed: enemyDef.baseSpeed * speedScale
        };
      }

      // Layer 4: Get available enemy types based on elapsed time
      function getAvailableEnemyTypes() {
        var elapsed = gameState.elapsed;
        var available = [];
        var typeIds = Object.keys(ENEMY_DEFS);
        for (var i = 0; i < typeIds.length; i++) {
          var def = ENEMY_DEFS[typeIds[i]];
          if (elapsed >= def.unlockTime) {
            available.push(typeIds[i]);
          }
        }
        return available;
      }

      // Layer 4: Select enemy type with weighted random
      function selectEnemyType() {
        var available = getAvailableEnemyTypes();
        if (available.length === 0) return 'skeleton';

        // Weight newer (higher index) types more heavily
        var weights = [];
        var totalWeight = 0;
        for (var i = 0; i < available.length; i++) {
          var w = 1 + i * 0.5;
          weights.push(w);
          totalWeight += w;
        }

        var roll = Math.random() * totalWeight;
        var cumulative = 0;
        for (var i = 0; i < available.length; i++) {
          cumulative += weights[i];
          if (roll <= cumulative) return available[i];
        }
        return available[available.length - 1];
      }

      // Layer 4: Factory function for creating enemies of any type
      function createEnemy(typeId, x, y) {
        var def = ENEMY_DEFS[typeId];
        if (!def) def = ENEMY_DEFS['skeleton'];
        var scaled = getScaledEnemyStats(def);

        return {
          x: x,
          y: y,
          hp: scaled.hp,
          maxHp: scaled.hp,
          speed: scaled.speed,
          contactDamage: def.contactDamage,
          radius: def.radius,
          width: def.width,
          height: def.height,
          flashTimer: 0,
          spawnId: getNextSpawnId(),
          type: typeId,
          alive: true,
          tier: def.tier,
          behavior: def.behavior,
          projectileResistance: def.projectileResistance || 0,
          splitOnDeath: def.splitOnDeath || false,
          splitCount: def.splitCount || 0,
          isSmall: false,
          damageAura: def.damageAura || false,
          auraRadius: def.auraRadius || 0,
          auraDamage: def.auraDamage || 0,
          auraTickRate: def.auraTickRate || 0,
          auraTimer: 0,
          zigzagPhase: Math.random() * Math.PI * 2,
          zigzagAmplitude: 40,
          zigzagFrequency: 3,
          chargeState: 'approaching',
          chargeTimer: 0,
          chargeTargetX: 0,
          chargeTargetY: 0,
          chargePauseTime: def.chargePauseTime || 0,
          chargeSpeed: def.chargeSpeed || 0,
          chargeDuration: def.chargeDuration || 0,
          chargeRange: def.chargeRange || 0,
          teleportTimer: 0,
          teleportInterval: def.teleportInterval || 0,
          teleportDistance: def.teleportDistance || 0,
          xpSize: def.xpSize || 'small'
        };
      }

      // Layer 4: Slime split on death
      function spawnSplitSlimes(parentEnemy) {
        var def = ENEMY_DEFS[parentEnemy.type];
        if (!def) return;
        var count = parentEnemy.splitCount || 2;
        var scaled = getScaledEnemyStats(def);

        for (var i = 0; i < count; i++) {
          var offsetAngle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
          var offsetDist = 15 + Math.random() * 10;

          var smallEnemy = createEnemy(parentEnemy.type,
            parentEnemy.x + Math.cos(offsetAngle) * offsetDist,
            parentEnemy.y + Math.sin(offsetAngle) * offsetDist
          );
          // Override to make it a small slime
          smallEnemy.isSmall = true;
          smallEnemy.splitOnDeath = false;
          smallEnemy.hp = Math.floor(scaled.hp * 0.4);
          smallEnemy.maxHp = smallEnemy.hp;
          smallEnemy.width = 20;
          smallEnemy.height = 16;
          smallEnemy.radius = 8;
          smallEnemy.speed = scaled.speed * 1.2;
          smallEnemy.contactDamage = 5;

          gameState.enemies.push(smallEnemy);
        }
      }

      // Layer 4: Enemy behavior functions
      function updateEnemyChase(enemy, player, dt) {
        var dx = player.x - enemy.x;
        var dy = player.y - enemy.y;
        var dist = Math.hypot(dx, dy);
        if (dist > 0) {
          enemy.x += (dx / dist) * enemy.speed * dt;
          enemy.y += (dy / dist) * enemy.speed * dt;
        }
      }

      function updateEnemyZigzag(enemy, player, dt) {
        var dx = player.x - enemy.x;
        var dy = player.y - enemy.y;
        var dist = Math.hypot(dx, dy);
        if (dist > 0) {
          var dirX = dx / dist;
          var dirY = dy / dist;
          var perpX = -dirY;
          var perpY = dirX;
          var zigOffset = Math.sin(gameState.elapsed * enemy.zigzagFrequency + enemy.zigzagPhase);
          enemy.x += (dirX * enemy.speed + perpX * zigOffset * enemy.zigzagAmplitude) * dt;
          enemy.y += (dirY * enemy.speed + perpY * zigOffset * enemy.zigzagAmplitude) * dt;
        }
      }

      function updateEnemyCharge(enemy, player, dt) {
        if (enemy.chargeState === 'approaching') {
          updateEnemyChase(enemy, player, dt);
          var dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
          if (dist <= enemy.chargeRange) {
            enemy.chargeState = 'pausing';
            enemy.chargeTimer = enemy.chargePauseTime;
          }
        } else if (enemy.chargeState === 'pausing') {
          enemy.chargeTimer -= dt;
          if (enemy.chargeTimer <= 0) {
            enemy.chargeTargetX = player.x;
            enemy.chargeTargetY = player.y;
            enemy.chargeState = 'charging';
            enemy.chargeTimer = enemy.chargeDuration;
          }
        } else if (enemy.chargeState === 'charging') {
          var dx = enemy.chargeTargetX - enemy.x;
          var dy = enemy.chargeTargetY - enemy.y;
          var dist = Math.hypot(dx, dy);
          if (dist > 0) {
            enemy.x += (dx / dist) * enemy.chargeSpeed * dt;
            enemy.y += (dy / dist) * enemy.chargeSpeed * dt;
          }
          enemy.chargeTimer -= dt;
          if (enemy.chargeTimer <= 0) {
            enemy.chargeState = 'recovering';
            enemy.chargeTimer = 0.5;
          }
        } else if (enemy.chargeState === 'recovering') {
          enemy.chargeTimer -= dt;
          if (enemy.chargeTimer <= 0) {
            enemy.chargeState = 'approaching';
          }
        }
      }

      function updateEnemyTeleport(enemy, player, dt) {
        // Chase normally
        updateEnemyChase(enemy, player, dt);

        // Teleport periodically
        enemy.teleportTimer += dt;
        if (enemy.teleportTimer >= enemy.teleportInterval) {
          enemy.teleportTimer -= enemy.teleportInterval;
          var angle = Math.random() * Math.PI * 2;
          enemy.x = Math.max(0, Math.min(WORLD_W, enemy.x + Math.cos(angle) * enemy.teleportDistance));
          enemy.y = Math.max(0, Math.min(WORLD_H, enemy.y + Math.sin(angle) * enemy.teleportDistance));
        }
      }

      function updateEnemies(dt) {
        var player = gameState.player;
        if (!player) return;

        // Layer 4: Wave system timing
        gameState.waveTimer += dt;
        if (gameState.waveTimer >= WAVE_DURATION) {
          gameState.waveTimer -= WAVE_DURATION;
          gameState.waveNumber++;
          gameState.waveAnnouncementTimer = 1.0;
          window.playSound('wave_warning');
        }
        if (gameState.waveAnnouncementTimer > 0) {
          gameState.waveAnnouncementTimer -= dt;
          if (gameState.waveAnnouncementTimer < 0) gameState.waveAnnouncementTimer = 0;
        }

        // Layer 4: Dynamic spawn rate (replaces fixed SPAWN_INTERVAL)
        if (gameState.elapsed >= SPAWN_DELAY) {
          var currentRate = getCurrentSpawnRate();
          // Layer 12: Performance degradation reduces spawn rate
          if (gameState.performanceDegraded) {
            currentRate *= DEGRADED_SPAWN_RATE_FACTOR;
          }
          var spawnInterval = 1 / currentRate;
          spawnTimer += dt;
          while (spawnTimer >= spawnInterval && gameState.enemies.length < MAX_ENEMIES_LAYER4) {
            // Layer 12: Additional global entity cap check
            if (getTotalEntityCount() >= HARD_ENTITY_CAP) break;
            spawnEnemy();
            spawnTimer -= spawnInterval;
          }
        }

        // Move all enemies with behavior-specific logic
        for (var i = 0; i < gameState.enemies.length; i++) {
          var enemy = gameState.enemies[i];
          if (!enemy.alive) continue;

          // Layer 4: Behavior dispatch
          if (enemy.behavior === 'zigzag') {
            updateEnemyZigzag(enemy, player, dt);
          } else if (enemy.behavior === 'charge') {
            updateEnemyCharge(enemy, player, dt);
          } else if (enemy.behavior === 'teleport') {
            updateEnemyTeleport(enemy, player, dt);
          } else {
            // Default chase behavior (skeleton, slime, zombie, ghost, deathknight)
            updateEnemyChase(enemy, player, dt);
          }

          // Layer 4: Death knight damage aura
          if (enemy.damageAura && enemy.alive) {
            enemy.auraTimer += dt;
            if (enemy.auraTimer >= enemy.auraTickRate) {
              enemy.auraTimer -= enemy.auraTickRate;
              var distToPlayer = Math.hypot(enemy.x - player.x, enemy.y - player.y);
              if (distToPlayer <= enemy.auraRadius) {
                damagePlayer(enemy.auraDamage);
              }
            }
          }

          // Tick flash timer (unchanged)
          if (enemy.flashTimer > 0) {
            enemy.flashTimer -= dt;
            if (enemy.flashTimer < 0) enemy.flashTimer = 0;
          }
        }

        // Cleanup: remove enemies that are too far from the player or dead
        // Layer 6: Boss enemies are exempt from distance cleanup
        for (var i = gameState.enemies.length - 1; i >= 0; i--) {
          var enemy = gameState.enemies[i];
          var dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);

          if (!enemy.alive || (dist > CLEANUP_DISTANCE && !enemy.isBoss)) {
            gameState.enemies.splice(i, 1);
          }
        }
      }

      function spawnEnemy() {
        var cam = gameState.camera;
        var player = gameState.player;
        if (!player) return;

        if (gameState.enemies.length >= MAX_ENEMIES_LAYER4) return;

        // Layer 4: Select enemy type based on elapsed time and weights
        var selectedType = selectEnemyType();

        // Pick a random edge: 0=top, 1=bottom, 2=left, 3=right
        var edge = Math.floor(Math.random() * 4);
        var offset = 50 + Math.random() * 50;
        var baseX, baseY;

        switch (edge) {
          case 0: baseX = cam.x + Math.random() * VIEWPORT_W; baseY = cam.y - offset; break;
          case 1: baseX = cam.x + Math.random() * VIEWPORT_W; baseY = cam.y + VIEWPORT_H + offset; break;
          case 2: baseX = cam.x - offset; baseY = cam.y + Math.random() * VIEWPORT_H; break;
          case 3: baseX = cam.x + VIEWPORT_W + offset; baseY = cam.y + Math.random() * VIEWPORT_H; break;
        }

        baseX = Math.max(0, Math.min(WORLD_W, baseX));
        baseY = Math.max(0, Math.min(WORLD_H, baseY));

        // Layer 4: Zombie cluster spawning
        if (selectedType === 'zombie') {
          var clusterCount = 4 + Math.floor(Math.random() * 5); // 4-8
          clusterCount = Math.min(clusterCount, MAX_ENEMIES_LAYER4 - gameState.enemies.length);
          for (var ci = 0; ci < clusterCount; ci++) {
            var cx = baseX + (Math.random() - 0.5) * 60;
            var cy = baseY + (Math.random() - 0.5) * 60;
            cx = Math.max(0, Math.min(WORLD_W, cx));
            cy = Math.max(0, Math.min(WORLD_H, cy));
            gameState.enemies.push(createEnemy('zombie', cx, cy));
          }
          return;
        }

        // Normal single spawn
        gameState.enemies.push(createEnemy(selectedType, baseX, baseY));
      }

      function removeEnemy(index) {
        gameState.enemies.splice(index, 1);
      }

      // =====================================================================
      // WEAPONS (weapons.js)
      // =====================================================================

      function initWeapons() {
        gameState.projectiles = [];
        gameState.weaponEffects = [];
        // Reset cooldown timers for all held weapons
        for (var i = 0; i < gameState.weapons.length; i++) {
          gameState.weapons[i].cooldownTimer = 0;
        }
      }

      function updateWeapons(dt) {
        var player = gameState.player;
        if (!player) return;

        // Tick each weapon's cooldown independently
        for (var i = 0; i < gameState.weapons.length; i++) {
          var w = gameState.weapons[i];
          var def = WEAPON_DEFS[w.id];
          if (!def) continue;
          var levelStats = def.levels[w.level - 1];
          var effectiveCooldown = levelStats.cooldown * player.cooldownReduction;

          w.cooldownTimer += dt;
          if (w.cooldownTimer >= effectiveCooldown) {
            fireWeapon(w, levelStats);
            w.cooldownTimer -= effectiveCooldown;
          }
        }

        // Update all projectiles (knives, fireballs, axes)
        updateProjectiles(dt);

        // Update all weapon effects (garlic, holywater, whip, runic, lightning)
        updateWeaponEffects(dt);
      }

      // Layer 11: Find nearest alive enemy within a given range of the player
      function findNearestEnemy(maxRange) {
        var player = gameState.player;
        if (!player) return null;
        var nearest = null;
        var nearestDist = maxRange + 1;
        for (var i = 0; i < gameState.enemies.length; i++) {
          var e = gameState.enemies[i];
          if (!e.alive) continue;
          var d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < nearestDist) {
            nearest = e;
            nearestDist = d;
          }
        }
        return nearest;
      }

      function fireWeapon(w, levelStats) {
        // Layer 10: Trigger weapon icon pulse
        gameState.weaponPulseTimers[w.id] = WEAPON_PULSE_DURATION;

        switch (w.id) {
          case 'knife':
            fireKnife(w, levelStats);
            window.playSound('knife_throw');
            break;
          case 'garlic':
            fireGarlic(w, levelStats);
            window.playSound('garlic_pulse');
            break;
          case 'holywater':
            fireHolyWater(w, levelStats);
            window.playSound('holy_water_splash');
            break;
          case 'firewand':
            fireFireWand(w, levelStats);
            window.playSound('fireball_launch');
            break;
          case 'lightning':
            fireLightning(w, levelStats);
            window.playSound('lightning_strike');
            break;
          case 'axe':
            fireAxe(w, levelStats);
            window.playSound('axe_throw');
            break;
          case 'whip':
            fireWhip(w, levelStats);
            window.playSound('whip_crack');
            break;
          case 'runic':
            fireRunic(w, levelStats);
            window.playSound('runic_blast');
            break;
        }
      }

      // Layer 11: Auto-aim knife at nearest enemy; fall back to facing direction
      function fireKnife(weaponInstance, levelStats) {
        var player = gameState.player;
        if (!player) return;

        // Layer 11: Auto-aim at nearest enemy; fall back to facing direction
        var target = findNearestEnemy(KNIFE_AUTO_AIM_RANGE);
        var fx, fy;
        if (target) {
          var dx = target.x - player.x;
          var dy = target.y - player.y;
          var dist = Math.hypot(dx, dy);
          if (dist > 0) {
            fx = dx / dist;
            fy = dy / dist;
          } else {
            fx = player.facingX || 1;
            fy = player.facingY || 0;
          }
        } else {
          fx = player.facingX;
          fy = player.facingY;
          if (fx === 0 && fy === 0) { fx = 1; fy = 0; }
          var len = Math.hypot(fx, fy);
          fx = fx / len;
          fy = fy / len;
        }

        var baseAngle = Math.atan2(fy, fx);

        var count = levelStats.projectiles;
        var spreadAngles;
        if (count === 1) {
          spreadAngles = [0];
        } else if (count === 2) {
          spreadAngles = [7 * Math.PI / 180, -7 * Math.PI / 180];
        } else if (count === 3) {
          spreadAngles = [0, 10 * Math.PI / 180, -10 * Math.PI / 180];
        } else {
          spreadAngles = [5 * Math.PI / 180, -5 * Math.PI / 180, 15 * Math.PI / 180, -15 * Math.PI / 180];
        }

        for (var i = 0; i < count && i < spreadAngles.length; i++) {
          var angle = baseAngle + spreadAngles[i];
          var vx = Math.cos(angle) * levelStats.speed;
          var vy = Math.sin(angle) * levelStats.speed;

          gameState.projectiles.push({
            x: player.x,
            y: player.y,
            vx: vx,
            vy: vy,
            damage: levelStats.damage,
            radius: 5,
            width: 4,
            height: 10,
            alive: true,
            type: 'knife',
            piercing: false,
            hitEnemies: [],
            age: 0,
            spawnX: player.x,
            spawnY: player.y,
            maxRange: KNIFE_MAX_RANGE
          });
        }
      }

      function fireGarlic(weaponInstance, levelStats) {
        var player = gameState.player;
        if (!player) return;

        // Check if a garlic_aura effect already exists
        var existingAura = null;
        for (var i = 0; i < gameState.weaponEffects.length; i++) {
          if (gameState.weaponEffects[i].type === 'garlic_aura') {
            existingAura = gameState.weaponEffects[i];
            break;
          }
        }

        if (existingAura) {
          // Update existing aura
          existingAura.damage = levelStats.damage;
          existingAura.radius = levelStats.radius;
          existingAura.tickRate = levelStats.tickRate;
          existingAura.lifetime = 9999;
          existingAura.maxLifetime = 9999;
        } else {
          // Create new garlic aura
          gameState.weaponEffects.push({
            type: 'garlic_aura',
            x: player.x,
            y: player.y,
            damage: levelStats.damage,
            lifetime: 9999,
            maxLifetime: 9999,
            alive: true,
            radius: levelStats.radius,
            tickTimer: 0,
            tickRate: levelStats.tickRate,

      function fireHolyWater(weaponInstance, levelStats) {
        var player = gameState.player;
        if (!player) return;

        for (var i = 0; i < levelStats.pools; i++) {
          var px = player.x + (Math.random() - 0.5) * 300;

            targetX: 0, targetY: 0
          });

      }

      function fireFireWand(weaponInstance, levelStats) {
        var player = gameState.player;
        if (!player) return;

        var count = levelStats.projectiles;
        var enemies = gameState.enemies;

        // Find N nearest enemies
        var nearestEnemies = [];
        for (var i = 0; i < enemies.length; i++) {
          if (!enemies[i].alive) continue;
          var d = Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y);
          nearestEnemies.push({enemy: enemies[i], dist: d});
        }
        nearestEnemies.sort(function(a, b) { return a.dist - b.dist; });

        for (var i = 0; i < count; i++) {
          var tx, ty;
          if (i < nearestEnemies.length) {
            tx = nearestEnemies[i].enemy.x;
            ty = nearestEnemies[i].enemy.y;
          } else {
            // Fire in facing direction
            var fx = player.facingX || 1;
            var fy = player.facingY || 0;
            var flen = Math.hypot(fx, fy);
            tx = player.x + (fx / flen) * 300;
            ty = player.y + (fy / flen) * 300;
          }

          var dx = tx - player.x;
          var dy = ty - player.y;
          var dist = Math.hypot(dx, dy);
          if (dist === 0) { dx = 1; dy = 0; dist = 1; }
          var nvx = (dx / dist) * levelStats.speed;
          var nvy = (dy / dist) * levelStats.speed;

          gameState.projectiles.push({
            x: player.x,
            y: player.y,
            vx: nvx,
            vy: nvy,
            damage: levelStats.damage,
            radius: 6,
            width: 6,
            height: 6,
            alive: true,
            type: 'fireball',
            piercing: true,
            hitEnemies: [],
            age: 0,
            spawnX: player.x,
            spawnY: player.y,
            maxRange: 600
          });
        }
      }

      function fireLightning(weaponInstance, levelStats) {
        var player = gameState.player;
        if (!player) return;

        var enemies = gameState.enemies;
        var inRange = [];

        for (var i = 0; i < enemies.length; i++) {
          if (!enemies[i].alive) continue;
          var d = Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y);
          if (d <= levelStats.range) {
            inRange.push(enemies[i]);
          }
        }

        // Shuffle inRange for random selection
        for (var i = inRange.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = inRange[i]; inRange[i] = inRange[j]; inRange[j] = temp;
        }

        var strikes = Math.min(levelStats.strikes, inRange.length);
        for (var i = 0; i < strikes; i++) {
          var enemy = inRange[i];

          // Apply damage immediately
          applyWeaponDamage(enemy, levelStats.damage);

          // Create visual lightning bolt effect
          gameState.weaponEffects.push({
            type: 'lightning_bolt',
            x: enemy.x,
            y: enemy.y,
            damage: 0,
            lifetime: 0.15,
            maxLifetime: 0.15,
            alive: true,
            radius: 0,
            tickTimer: 0, tickRate: 0,
            width: 0, height: 0, facingX: 0,
            expandProgress: 0, maxRadius: 0,
            hitEnemies: [],
            targetX: enemy.x, targetY: enemy.y
          });
        }
      }

      // Layer 11: Auto-aim axe at nearest enemy; fall back to facing direction
      function fireAxe(weaponInstance, levelStats) {
        var player = gameState.player;
        if (!player) return;

        // Layer 11: Auto-aim at nearest enemy; fall back to facing direction
        var target = findNearestEnemy(AXE_AUTO_AIM_RANGE);
        var fx, fy;
        if (target) {
          var dx = target.x - player.x;
          var dy = target.y - player.y;
          var dist = Math.hypot(dx, dy);
          if (dist > 0) {
            fx = dx / dist;
            fy = dy / dist;
          } else {
            fx = player.facingX || 1;
            fy = player.facingY || 0;
          }
        } else {
          fx = player.facingX;
          fy = player.facingY;
          if (fx === 0 && fy === 0) { fx = 1; fy = 0; }
        }

        var len = Math.hypot(fx, fy);
        var nx = fx / len;
        var ny = fy / len;

        var count = levelStats.projectiles;
        for (var i = 0; i < count; i++) {
          gameState.projectiles.push({
            x: player.x,
            y: player.y,
            vx: nx * levelStats.speed,
            vy: ny * levelStats.speed,
            damage: levelStats.damage,
            radius: 7,
            width: 10,
            height: 14,
            alive: true,
            type: 'axe',
            piercing: true,
            hitEnemies: [],
            age: 0,
            spawnX: player.x,
            spawnY: player.y,
            maxRange: 500,
            baseY: player.y,
            phaseOffset: i * Math.PI / 2
          });
        }
      }

      function fireWhip(weaponInstance, levelStats) {

        gameState.weaponEffects.push({
