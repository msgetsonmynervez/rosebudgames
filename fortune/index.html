<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinning Cube</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a0033 0%, #0a0015 50%, #1a0033 100%);
            font-family: 'Georgia', serif;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }
        #fortune-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin: 0 0 1rem 0;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            font-weight: normal;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #9370db;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            margin-bottom: 2rem;
            font-style: italic;
        }
        #question-box {
            background: rgba(20, 10, 40, 0.8);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }
        #question-input {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid #9370db;
            border-radius: 10px;
            background: rgba(10, 5, 20, 0.9);
            color: #d4af37;
            font-family: 'Georgia', serif;
            margin-bottom: 1rem;
            resize: none;
            min-height: 80px;
        }
        #question-input::placeholder {
            color: #9370db;
            opacity: 0.7;
        }
        #question-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        #submit-btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #1a0033;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        #submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }
        #submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        #submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #prediction-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(147, 112, 219, 0.1);
            border: 2px solid #9370db;
            border-radius: 15px;
            color: #e6d5ff;
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
            min-height: 100px;
            display: none;
            animation: fadeIn 0.8s ease;
            box-shadow: 0 0 20px rgba(147, 112, 219, 0.3);
        }
        #prediction-box.show {
            display: block;
        }
        .loading {
            color: #d4af37;
            font-style: italic;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @media (max-width: 600px) {
            #fortune-container {
                width: 95%;
                padding: 0 10px;
            }
            #question-box {
                padding: 1rem;
            }
            #submit-btn {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "components/": "./src/components/"
        }
    }
    </script>

<style>
    #rosebud-exported-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        opacity: 1;
        transition: opacity 500ms ease-in-out;
    }

    #rosebud-exported-splash.is-hiding {
        opacity: 0;
    }

    #rosebud-exported-splash .rosebud-exported-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #rosebud-exported-splash .rosebud-exported-splash__logo {
        width: 100px;
        height: 100px;
        animation: rosebud-exported-splash-breathe 2.4s ease-in-out infinite;
    }

    #rosebud-exported-splash .rosebud-exported-splash__text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 16px;
        line-height: 1.25;
        letter-spacing: 0.06em;
    }

    #rosebud-exported-splash .rosebud-exported-splash__text strong {
        font-weight: 700;
    }

    #rosebud-exported-splash .rosebud-exported-splash__text span:last-child {
        opacity: 0.88;
    }

    @keyframes rosebud-exported-splash-breathe {
        0%,
        100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.05);
        }
    }
</style></head>
<body>
<div id="rosebud-exported-splash" aria-live="polite">
    <div class="rosebud-exported-splash__content">
        <img
            class="rosebud-exported-splash__logo"
            src="__rosebud/rosebud-icon.png"
            alt="Rosebud Logo"
            width="100"
            height="100"
        />
        <div class="rosebud-exported-splash__text" aria-label="Rosebud.AI Make Games">
            <strong>Rosebud.AI</strong>
            <span>Make Games</span>
        </div>
    </div>
</div>
    <div id="fortune-container">
        <h1>✨ Madame Mystique ✨</h1>
        <p class="subtitle">The All-Seeing Oracle</p>
        
        <div id="question-box">
            <textarea 
                id="question-input" 
                placeholder="Ask about your future... What does destiny hold for you?"
                maxlength="200"
            ></textarea>
            <button id="submit-btn">Reveal My Fortune</button>
        </div>
        
        <div id="prediction-box"></div>
    </div>
    
    <script type="module" src="src/main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ChatManager.js"></script>

<script>
    (() => {
        const splashRoot = document.getElementById('rosebud-exported-splash');
        if (!splashRoot) return;

        let isReady = false;
        let isMinimumVisibleTimeElapsed = false;
        let isHidden = false;

        const maybeHideSplash = () => {
            if (isHidden || !isReady || !isMinimumVisibleTimeElapsed) return;

            isHidden = true;
            splashRoot.classList.add('is-hiding');
            window.setTimeout(() => splashRoot.remove(), 500);
        };

        const markReady = () => {
            isReady = true;
            maybeHideSplash();
        };

        window.setTimeout(() => {
            isMinimumVisibleTimeElapsed = true;
            maybeHideSplash();
        }, 1000);

        if (document.readyState === 'complete') {
            markReady();
        } else {
            window.addEventListener('load', markReady, { once: true });
        }

        
    })();
</script></body>
</html>
